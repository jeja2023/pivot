<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pivot 远程演示</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020617;color:#e2e8f0;font-family:"Microsoft YaHei",system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;background:#0f172a;border-bottom:1px solid #334155;font-size:13px}.status{color:#93c5fd}.wrap{display:grid;place-items:center;padding:16px;min-height:0}.stage{position:relative;width:min(96vw,calc(96vh * 16 / 9));aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.45)}.el{position:absolute;overflow:hidden;white-space:pre-wrap;word-break:break-word}.shape{border-style:solid}.image{background:center/cover no-repeat}.diagram{display:flex;align-items:center;justify-content:center;gap:8px}.diagram.vertical{flex-direction:column}.diagram span{display:grid;place-items:center;min-width:60px;min-height:32px;padding:6px;border:1px solid;border-radius:8px;text-align:center}.diagram i{font-style:normal;color:#64748b}.media{display:grid;place-items:center;background:#0f172a;border:1px solid #64748b;border-radius:10px;color:#fff}.media video,.media audio{width:100%;height:100%;object-fit:contain}.attachment{display:flex;align-items:center;padding:12px;background:#f8fafc;border:1px solid #64748b;border-radius:8px;color:#1e293b}.table{display:grid;border:1px solid #cbd5e1}.table-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}.cell{padding:5px;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;font-size:12px}.chart{display:flex;align-items:flex-end;gap:7px;height:100%;padding:28px 14px 16px;border:1px solid #cbd5e1;background:#fff}.chart i{display:block;flex:1;min-width:4px;border-radius:4px 4px 0 0}.fade{animation:fade .28s ease both}@keyframes zoom{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0);opacity:1}}@keyframes fly{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}@keyframes fade{from{opacity:.35}to{opacity:1}}@media(max-width:720px){.wrap{padding:6px}.stage{width:100vw}.bar{padding:8px 10px}}
</style></head><body><header class="bar"><strong id="title">Pivot 远程演示</strong><span id="status" class="status">正在连接…</span></header><main class="wrap"><div id="stage" class="stage" aria-live="polite"></div></main><script src="/presentation-display.js"></script></body></html>
