<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流模板商城 - Pivot</title>
    <link rel="stylesheet" href="../chat/tailwind-output.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .template-card {
            transition: all 0.3s ease;
        }
        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        .tag {
            transition: background-color 0.2s ease;
        }
        .tag:hover {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="../chat/chat.html" class="text-xl font-bold text-gray-900">
                        ← 返回工作台
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="搜索模板..."
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 页面标题 -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">工作流模板商城</h1>
            <p class="text-gray-600">发现并使用预定义的工作流模板，快速构建智能自动化流程</p>
        </div>

        <!-- 筛选和排序 -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- 分类筛选 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">分类</label>
                    <select id="categoryFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">全部分类</option>
                    </select>
                </div>

                <!-- 难度筛选 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">难度</label>
                    <select id="difficultyFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">全部难度</option>
                        <option value="beginner">入门</option>
                        <option value="intermediate">进阶</option>
                        <option value="advanced">高级</option>
                    </select>
                </div>

                <!-- 排序 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">排序</label>
                    <select id="sortBy" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="rating_avg">评分最高</option>
                        <option value="usage_count">最常使用</option>
                        <option value="created_at">最新发布</option>
                        <option value="name">名称排序</option>
                    </select>
                </div>

                <!-- 重置按钮 -->
                <div class="flex items-end">
                    <button
                        id="resetFilters"
                        class="w-full px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors"
                    >
                        重置筛选
                    </button>
                </div>
            </div>
        </div>

        <!-- 模板列表 -->
        <div id="templatesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 加载提示 -->
            <div class="col-span-full text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-blue-600"></div>
                <p class="mt-4 text-gray-600">加载模板中...</p>
            </div>
        </div>

        <!-- 分页 -->
        <div id="pagination" class="mt-8 flex justify-center items-center space-x-2">
            <!-- 分页按钮将在这里动态生成 -->
        </div>
    </div>

    <!-- 模板卡片模板 -->
    <template id="templateCardTemplate">
        <div class="template-card bg-white rounded-lg shadow-sm p-6 cursor-pointer border border-gray-200">
            <div class="flex items-start justify-between mb-4">
                <div class="flex-1">
                    <h3 class="text-lg font-semibold text-gray-900 mb-2 template-name"></h3>
                    <p class="text-sm text-gray-600 template-description line-clamp-2"></p>
                </div>
                <span class="builtin-badge ml-2 px-2 py-1 bg-blue-100 text-blue-800 text-xs font-medium rounded" style="display: none;">
                    官方
                </span>
            </div>

            <div class="mb-4">
                <span class="category-badge inline-block px-3 py-1 bg-gray-100 text-gray-700 text-sm rounded-full"></span>
                <span class="difficulty-badge inline-block ml-2 px-3 py-1 text-sm rounded-full"></span>
            </div>

            <div class="template-tags mb-4 flex flex-wrap gap-2">
                <!-- 标签将在这里动态生成 -->
            </div>

            <div class="flex items-center justify-between text-sm text-gray-600">
                <div class="flex items-center space-x-4">
                    <span class="flex items-center">
                        <span class="text-amber-500 font-semibold mr-1">★</span><span class="rating"></span>
                    </span>
                    <span class="flex items-center">
                        <span class="usage-count mr-1"></span> 次使用
                    </span>
                </div>
                <span class="estimated-time text-xs"></span>
            </div>
        </div>
    </template>

    <script src="../src/services/agent/templateService.js"></script>
    <script>
        // 页面状态
        let currentPage = 1;
        let pageSize = 12;
        let totalCount = 0;
        let currentFilters = {
            category: '',
            difficulty: '',
            search: '',
            sortBy: 'rating_avg'
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategories();
            await loadTemplates();
            setupEventListeners();
        });

        // 加载分类
        async function loadCategories() {
            try {
                const categories = await window.TemplateService.getCategories();
                const select = document.getElementById('categoryFilter');

                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.slug;
                    option.textContent = `${cat.icon || ''} ${cat.name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load categories:', error);
            }
        }

        // 加载模板列表
        async function loadTemplates() {
            try {
                const params = {
                    page: currentPage,
                    pageSize: pageSize,
                    category: currentFilters.category,
                    difficulty: currentFilters.difficulty,
                    search: currentFilters.search,
                    sortBy: currentFilters.sortBy
                };

                const response = await window.TemplateService.listTemplates(params);
                totalCount = response.total;

                renderTemplates(response.data);
                renderPagination();
            } catch (error) {
                console.error('Failed to load templates:', error);
                showError('加载模板失败，请刷新页面重试');
            }
        }

        // 渲染模板列表
        function renderTemplates(templates) {
            const container = document.getElementById('templatesList');
            container.innerHTML = '';

            if (templates.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-gray-500 text-lg">没有找到符合条件的模板</p>
                        <p class="text-gray-400 mt-2">试试调整筛选条件</p>
                    </div>
                `;
                return;
            }

            templates.forEach(template => {
                const card = createTemplateCard(template);
                container.appendChild(card);
            });
        }

        // 创建模板卡片
        function createTemplateCard(template) {
            const template_el = document.getElementById('templateCardTemplate');
            const card = template_el.content.cloneNode(true);
            const container = card.querySelector('.template-card');

            // 设置数据
            card.querySelector('.template-name').textContent = template.name;
            card.querySelector('.template-description').textContent = template.description;
            card.querySelector('.category-badge').textContent = template.category_name || '其他';
            card.querySelector('.rating').textContent = template.rating_avg?.toFixed(1) || '暂无';
            card.querySelector('.usage-count').textContent = template.usage_count || 0;
            card.querySelector('.estimated-time').textContent = template.estimated_time || '未知';

            // 官方标识
            if (template.is_builtin) {
                card.querySelector('.builtin-badge').style.display = 'inline-block';
            }

            // 难度标识
            const difficultyBadge = card.querySelector('.difficulty-badge');
            const difficultyMap = {
                'beginner': { text: '入门', color: 'bg-green-100 text-green-800' },
                'intermediate': { text: '进阶', color: 'bg-yellow-100 text-yellow-800' },
                'advanced': { text: '高级', color: 'bg-red-100 text-red-800' }
            };
            const difficulty = difficultyMap[template.difficulty] || difficultyMap['beginner'];
            difficultyBadge.textContent = difficulty.text;
            difficultyBadge.className = `difficulty-badge inline-block ml-2 px-3 py-1 text-sm rounded-full ${difficulty.color}`;

            // 标签
            const tagsContainer = card.querySelector('.template-tags');
            const tags = typeof template.tags === 'string' ? JSON.parse(template.tags) : (template.tags || []);
            tags.slice(0, 3).forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = 'tag px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded cursor-pointer';
                tagEl.textContent = tag;
                tagsContainer.appendChild(tagEl);
            });

            // 点击事件
            container.addEventListener('click', () => {
                window.location.href = `template-detail.html?id=${template.id}`;
            });

            return card;
        }

        // 渲染分页
        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            const totalPages = Math.ceil(totalCount / pageSize);
            if (totalPages <= 1) return;

            // 上一页
            if (currentPage > 1) {
                const prevBtn = createPageButton('上一页', currentPage - 1);
                container.appendChild(prevBtn);
            }

            // 页码
            for (let i = 1; i <= totalPages; i++) {
                if (
                    i === 1 ||
                    i === totalPages ||
                    (i >= currentPage - 2 && i <= currentPage + 2)
                ) {
                    const pageBtn = createPageButton(i, i, i === currentPage);
                    container.appendChild(pageBtn);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.className = 'px-2 text-gray-500';
                    container.appendChild(ellipsis);
                }
            }

            // 下一页
            if (currentPage < totalPages) {
                const nextBtn = createPageButton('下一页', currentPage + 1);
                container.appendChild(nextBtn);
            }
        }

        // 创建分页按钮
        function createPageButton(text, page, isActive = false) {
            const btn = document.createElement('button');
            btn.textContent = text;
            btn.className = `px-4 py-2 rounded-lg transition-colors ${
                isActive
                    ? 'bg-blue-600 text-white'
                    : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-300'
            }`;
            btn.onclick = () => {
                currentPage = page;
                loadTemplates();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            return btn;
        }

        // 设置事件监听
        function setupEventListeners() {
            // 搜索
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentFilters.search = e.target.value;
                    currentPage = 1;
                    loadTemplates();
                }, 500);
            });

            // 分类筛选
            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                currentFilters.category = e.target.value;
                currentPage = 1;
                loadTemplates();
            });

            // 难度筛选
            document.getElementById('difficultyFilter').addEventListener('change', (e) => {
                currentFilters.difficulty = e.target.value;
                currentPage = 1;
                loadTemplates();
            });

            // 排序
            document.getElementById('sortBy').addEventListener('change', (e) => {
                currentFilters.sortBy = e.target.value;
                currentPage = 1;
                loadTemplates();
            });

            // 重置筛选
            document.getElementById('resetFilters').addEventListener('click', () => {
                currentFilters = {
                    category: '',
                    difficulty: '',
                    search: '',
                    sortBy: 'rating_avg'
                };
                document.getElementById('searchInput').value = '';
                document.getElementById('categoryFilter').value = '';
                document.getElementById('difficultyFilter').value = '';
                document.getElementById('sortBy').value = 'rating_avg';
                currentPage = 1;
                loadTemplates();
            });
        }

        // 显示错误
        function showError(message) {
            const container = document.getElementById('templatesList');
            container.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <p class="text-red-500 text-lg">${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
