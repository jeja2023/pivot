<section id="admin-container" class="main-workspace-view settings-workspace-view hidden" aria-hidden="true" aria-labelledby="settings-workspace-title">
        <div class="modal admin-panel">
            <div class="workspace-modal-header settings-workspace-header">
                <div>
                    <h3 id="settings-workspace-title">系统设置</h3>
                    <p>集中管理模型、用户、审计、监控、用量、API 接入与账号安全。</p>
                </div>
                <button id="admin-modal-close" type="button" class="btn-secondary settings-close-btn">关闭</button>
            </div>
            <div id="settings-load-state" class="settings-state" role="status" aria-live="polite" hidden></div>
            <div class="admin-layout">
                <nav class="admin-sidebar" aria-label="设置分区" role="tablist" aria-orientation="vertical">

                    <!-- 一、监控与合规治理 -->
                    <button id="tab-ops" type="button" role="tab" aria-controls="tab-content-ops" aria-selected="false" tabindex="-1" class="admin-tab admin-only hidden">数据概览</button>
                    <button id="tab-monitor" type="button" role="tab" aria-controls="tab-content-monitor" aria-selected="false" tabindex="-1" class="admin-tab admin-only hidden">系统监控</button>
                    <button id="tab-usage" type="button" role="tab" aria-controls="tab-content-usage" aria-selected="false" tabindex="-1" class="admin-tab">用量审计</button>
                    <button id="tab-logs" type="button" role="tab" aria-controls="tab-content-logs" aria-selected="false" tabindex="-1" class="admin-tab admin-only hidden">审计日志</button>

                    <!-- 二、AI 引擎与模型配置 -->
                    <button id="tab-models" type="button" role="tab" aria-controls="tab-content-models" aria-selected="false" tabindex="-1" class="admin-tab">模型配置</button>
                    <button id="tab-tool-policy" type="button" role="tab" aria-controls="tab-content-tool-policy" aria-selected="false" tabindex="-1" class="admin-tab admin-only hidden">工具策略</button>
                    <button id="tab-global-params" type="button" role="tab" aria-controls="tab-content-global-params" aria-selected="false" tabindex="-1" class="admin-tab admin-only hidden">全局参数</button>

                    <!-- 三、组织与协同资产 -->
                    <button id="tab-users" type="button" role="tab" aria-controls="tab-content-users" aria-selected="false" tabindex="-1" class="admin-tab admin-only hidden">用户管理</button>
                    <button id="tab-announcements" type="button" role="tab" aria-controls="tab-content-announcements" aria-selected="false" tabindex="-1" class="admin-tab admin-only hidden">公告管理</button>
                    <button id="tab-memories" type="button" role="tab" aria-controls="tab-content-memories" aria-selected="false" tabindex="-1" class="admin-tab">长期记忆</button>
                    <button id="tab-attachments" type="button" role="tab" aria-controls="tab-content-attachments" aria-selected="false" tabindex="-1" class="admin-tab">附件库</button>

                    <!-- 四、开放接入与个人账号 -->
                    <button id="tab-keys" type="button" role="tab" aria-controls="tab-content-keys" aria-selected="false" tabindex="-1" class="admin-tab">API 接入</button>
                    <button id="tab-account" type="button" role="tab" aria-controls="tab-content-account" aria-selected="false" tabindex="-1" class="admin-tab">账号安全</button>
                    <div style="flex: 1;"></div>

                </nav>

                <main class="admin-content" aria-live="polite">
                    <div id="settings-tab-state" class="settings-state" role="status" aria-live="polite" hidden></div>
                    <div class="settings-scale-stage" id="settings-scale-stage">
                        <div class="settings-scale-canvas" id="settings-scale-canvas">
