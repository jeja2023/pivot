<!-- 用户管理 -->
                    <div id="tab-content-users" class="admin-tab-content users-tab hidden">
                        <div class="settings-page-head">
                            <div>
                                <h3>用户管理</h3>
                                <p>维护账号、显示名、单位、角色和登录状态，支持导入导出用户数据。</p>
                            </div>
                            <div class="footer-actions user-page-actions" style="margin-bottom: 0;">
                                <label id="public-registration-setting" class="public-registration-inline super-admin-only hidden" title="开启后，登录页会显示注册入口，新账号注册为普通用户。">
                                    <span class="public-registration-label">开放注册</span>
                                    <span id="public-registration-status" class="public-registration-badge is-off">已关闭</span>
                                    <span class="switch">
                                        <input type="checkbox" id="public-registration-toggle">
                                        <span class="switch-slider"></span>
                                    </span>
                                </label>
                                <input type="file" id="user-import-input" class="hidden" accept=".csv">
                                <button id="user-add-btn" type="button" class="btn-primary">添加用户</button>
                                <button id="user-template-btn" type="button" class="btn-secondary">下载模板</button>
                                <button id="user-import-btn" type="button" class="btn-secondary">导入用户</button>
                                <button id="user-export-btn" type="button" class="btn-secondary">导出用户</button>
                            </div>
                        </div>
                        <div class="filter-bar user-filter-bar">
                            <div class="filter-item filter-inline">
                                <label for="user-filter-search">用户</label>
                                <input type="text" id="user-filter-search" class="form-input" placeholder="用户名 / 显示名">
                            </div>
                            <div class="filter-item filter-inline">
                                <label for="user-filter-unit">单位</label>
                                <input type="text" id="user-filter-unit" class="form-input" placeholder="按单位筛选">
                            </div>
                            <div class="filter-item filter-inline">
                                <label for="user-filter-role">角色</label>
                                <select id="user-filter-role" class="form-input">
                                    <option value="">全部角色</option>
                                    <option value="super_admin">系统管理员</option>
                                    <option value="manager">管理员</option>
                                    <option value="user">普通用户</option>
                                </select>
                            </div>
                            <div class="filter-item filter-inline">
                                <label for="user-filter-status">状态</label>
                                <select id="user-filter-status" class="form-input">
                                    <option value="">全部状态（正常）</option>
                                    <option value="active">启用</option>
                                    <option value="disabled">禁用</option>
                                    <option value="deleted">已删除</option>
                                    <option value="all">全部状态（含已删除）</option>
                                </select>
                            </div>
                            <div class="filter-item filter-actions">
                                <button type="button" id="user-query-btn" class="btn-primary">查询</button>
                                <button type="button" id="user-reset-btn" class="btn-secondary">重置</button>
                            </div>
                        </div>
                        <div class="table-container users-table-wrap">
                            <table class="data-table compact-table users-table">
                                <colgroup>
                                    <col class="col-id">
                                    <col class="col-username">
                                    <col class="col-nickname">
                                    <col class="col-unit">
                                    <col class="col-role">
                                    <col class="col-status">
                                    <col class="col-created">
                                    <col class="col-login">
                                    <col class="col-actions">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>用户名</th>
                                        <th>显示名</th>
                                        <th>单位</th>
                                        <th>角色</th>
                                        <th>状态</th>
                                        <th>注册时间</th>
                                        <th>最后登录</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="user-list-body"></tbody>
                            </table>
                        </div>
                        <div id="pagination-users" class="pagination"></div>
                    </div>
