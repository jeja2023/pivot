<div id="tab-content-stats" class="usage-view hidden" data-usage-panel="stats" role="tabpanel" aria-labelledby="usage-subtab-stats">
    <div class="filter-bar stats-filter-bar">
        <div class="filter-item filter-inline">
            <label for="stats-filter-user">用户</label>
            <input type="text" id="stats-filter-user" class="form-input" placeholder="用户名 / 显示名">
        </div>
        <div class="filter-item filter-inline">
            <label for="stats-filter-model">模型</label>
            <input type="text" id="stats-filter-model" class="form-input" placeholder="模型名称">
        </div>
        <div class="filter-item filter-inline">
            <label for="stats-filter-start">开始日期</label>
            <input type="date" id="stats-filter-start" class="form-input">
        </div>
        <div class="filter-item filter-inline">
            <label for="stats-filter-end">结束日期</label>
            <input type="date" id="stats-filter-end" class="form-input">
        </div>
        <div class="filter-item filter-actions">
            <button type="button" id="stats-query-btn" class="btn-primary">查询</button>
            <button type="button" id="stats-reset-btn" class="btn-secondary">重置</button>
        </div>
    </div>
    <div class="table-container stats-table-wrap">
        <table class="data-table stats-usage-table">
            <colgroup>
                <col class="col-index">
                <col class="col-user">
                <col class="col-name">
                <col class="col-model">
                <col class="col-message">
                <col class="col-token">
                <col class="col-token">
                <col class="col-total">
                <col class="col-active">
            </colgroup>
            <thead>
                <tr>
                    <th class="text-center">序号</th>
                    <th>用户</th>
                    <th>显示名</th>
                    <th>模型</th>
                    <th class="text-center">消息数</th>
                    <th class="text-center">输入 Token</th>
                    <th class="text-center">输出 Token</th>
                    <th class="text-center">总 Token</th>
                    <th>最后活动</th>
                </tr>
            </thead>
            <tbody id="stats-list-body"></tbody>
        </table>
    </div>
    <div id="pagination-stats" class="pagination"></div>
</div>
