<!-- 长期记忆 -->
                    <section id="tab-content-memories" class="admin-tab-content memories-tab hidden">
                        <div class="settings-page-head">
                            <div>
                                <h3>长期记忆</h3>
                                <p>管理跨会话保留的偏好、事实、决策和历史片段。</p>
                            </div>
                            <div class="memory-toolbar">
                                <label class="memory-toggle">
                                    <input id="long-term-memory-toggle" type="checkbox">
                                    <span>启用</span>
                                </label>
                                <button id="memory-export-btn" class="btn-secondary">导出</button>
                                <button id="memory-merge-suggestions-btn" class="btn-secondary">合并建议</button>
                                <button id="memory-refresh-btn" class="btn-secondary">刷新</button>
                            </div>
                        </div>
                        <div class="memory-governance-shell">
                            <div class="memory-metrics-strip">
                                <div id="memory-summary-grid" class="memory-summary-grid"></div>
                                <div id="memory-quality-panel" class="memory-quality-panel"></div>
                            </div>
                            <div class="memory-control-bar">
                                <div class="memory-filter-bar">
                                    <div class="memory-filter-fields">
                                        <input id="memory-search-input" class="form-input" type="search" placeholder="搜索记忆">
                                        <select id="memory-status-filter" class="form-input">
                                            <option value="active">活跃</option>
                                            <option value="disabled">禁用</option>
                                            <option value="deleted">已删除</option>
                                            <option value="all">全部</option>
                                        </select>
                                        <select id="memory-type-filter" class="form-input">
                                            <option value="">全部类型</option>
                                            <option value="preference">用户偏好</option>
                                            <option value="fact">项目事实</option>
                                            <option value="decision">长期决策</option>
                                            <option value="episode">历史片段</option>
                                        </select>
                                    </div>
                                    <div class="memory-filter-actions">
                                        <button id="memory-archive-expired-btn" class="btn-secondary">归档过期</button>
                                        <button id="memory-bulk-enable-btn" class="btn-secondary">恢复选中</button>
                                        <button id="memory-bulk-disable-btn" class="btn-secondary">禁用选中</button>
                                        <button id="memory-bulk-delete-btn" class="btn-danger-outline">删除选中</button>
                                    </div>
                                </div>
                                <div id="memory-jobs-panel" class="memory-jobs-panel"></div>
                            </div>
                            <div id="memory-merge-panel" class="memory-merge-panel hidden"></div>
                            <div class="table-container memories-table-wrap">
                                <table class="data-table compact-table memories-table">
                                    <colgroup>
                                        <col class="memory-col-select">
                                        <col class="memory-col-type">
                                        <col class="memory-col-content">
                                        <col class="memory-col-score">
                                        <col class="memory-col-score">
                                        <col class="memory-col-status">
                                        <col class="memory-col-source">
                                        <col class="memory-col-used">
                                        <col class="memory-col-actions">
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th><input id="memory-select-all" type="checkbox"></th>
                                            <th>类型</th>
                                            <th>内容</th>
                                            <th>重要度</th>
                                            <th>置信度</th>
                                            <th>状态</th>
                                            <th>来源</th>
                                            <th>最近使用</th>
                                            <th class="text-center">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="memory-list-body"></tbody>
                                </table>
                            </div>
                            <div id="pagination-memories" class="pagination"></div>
                        </div>
                        <div id="memory-edit-modal" class="modal-overlay hidden" style="z-index: 5250;">
                            <div class="modal model-modal memory-modal memory-edit-modal">
                                <div class="model-modal-header memory-modal-header">
                                    <h3>编辑记忆</h3>
                                </div>
                                <form id="memory-edit-form" class="model-form memory-edit-form">
                                    <input type="hidden" id="memory-edit-id">
                                    <label class="form-item">
                                        <span>类型</span>
                                        <select id="memory-edit-type" class="form-input">
                                            <option value="preference">用户偏好</option>
                                            <option value="fact">项目事实</option>
                                            <option value="decision">长期决策</option>
                                            <option value="episode">历史片段</option>
                                        </select>
                                    </label>
                                    <label class="form-item memory-edit-content">
                                        <span>内容</span>
                                        <textarea id="memory-edit-content" class="form-input" rows="5" maxlength="800"></textarea>
                                    </label>
                                    <div class="model-form-row memory-edit-grid">
                                        <label class="form-item">
                                            <span>重要度</span>
                                            <input id="memory-edit-salience" class="form-input" type="number" min="0" max="1" step="0.05">
                                        </label>
                                        <label class="form-item">
                                            <span>置信度</span>
                                            <input id="memory-edit-confidence" class="form-input" type="number" min="0" max="1" step="0.05">
                                        </label>
                                    </div>
                                    <div class="model-modal-actions memory-modal-actions">
                                        <button id="memory-edit-cancel" type="button" class="btn-secondary">取消</button>
                                        <button id="memory-edit-save" type="submit" class="btn-primary">保存</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div id="memory-source-modal" class="modal-overlay hidden" style="z-index: 5260;">
                            <div class="modal model-modal memory-modal memory-source-modal">
                                <div class="model-modal-header memory-modal-header">
                                    <h3>来源</h3>
                                    <button id="memory-source-close" type="button" class="btn-secondary settings-close-btn memory-source-close">关闭</button>
                                </div>
                                <div class="model-form memory-source-form">
                                    <div id="memory-source-body" class="memory-source-body"></div>
                                </div>
                            </div>
                        </div>
                    </section>
