<!-- 长期记忆 -->
                    <section id="tab-content-memories" class="admin-tab-content memories-tab hidden">
                        <div class="settings-page-head">
                            <div>
                                <h3>长期记忆</h3>

                            </div>
                            <div class="memory-toolbar">
                                <label class="memory-toggle">
                                    <input id="long-term-memory-toggle" type="checkbox">

                                </label>
                                <button id="memory-export-btn" type="button" class="btn-secondary">导出</button>
                                <button id="memory-merge-suggestions-btn" type="button" class="btn-secondary">合并建议</button>
                                <button id="memory-evaluations-open-btn" type="button" class="btn-secondary">检索评测</button>
                                <button id="memory-refresh-btn" type="button" class="btn-secondary">刷新</button>
                            </div>
                        </div>
                        <div class="memory-governance-shell">
                            <div class="memory-metrics-strip">
                                <div id="memory-summary-grid" class="memory-summary-grid"></div>
                                <div id="memory-quality-panel" class="memory-quality-panel"></div>
                            </div>
                            <div class="memory-control-bar">
                                <div class="memory-filter-bar">
                                    <div class="memory-filter-fields">
                                        <input id="memory-search-input" class="form-input" type="search" placeholder="搜索记忆">
                                        <select id="memory-status-filter" class="form-input">
                                            <option value="active">活跃</option>
                                            <option value="pending">待确认</option>
                                            <option value="disabled">禁用</option>
                                            <option value="deleted">已删除</option>
                                            <option value="all">全部</option>
                                        </select>
                                        <select id="memory-type-filter" class="form-input">
                                            <option value="">全部类型</option>
                                            <option value="preference">用户偏好</option>
                                            <option value="fact">项目事实</option>
                                            <option value="decision">长期决策</option>
                                            <option value="episode">历史片段</option>
                                        </select>
                                    </div>
                                    <div class="memory-filter-actions">
                                        <button id="memory-archive-expired-btn" type="button" class="btn-secondary">归档过期</button>
                                        <button id="memory-bulk-enable-btn" type="button" class="btn-secondary">恢复选中</button>
                                        <button id="memory-bulk-disable-btn" type="button" class="btn-secondary">禁用选中</button>
                                        <button id="memory-bulk-delete-btn" type="button" class="btn-danger-outline">删除选中</button>
                                    </div>
                                </div>
                                <div id="memory-jobs-panel" class="memory-jobs-panel"></div>
                            </div>
                            <div id="memory-merge-panel" class="memory-merge-panel hidden"></div>
                            <div class="table-container memories-table-wrap">
                                <table class="data-table compact-table memories-table">
                                    <colgroup>
                                        <col class="memory-col-select">
                                        <col class="memory-col-type">
                                        <col class="memory-col-content">
                                        <col class="memory-col-score">
                                        <col class="memory-col-score">
                                        <col class="memory-col-status">
                                        <col class="memory-col-used">
                                        <col class="memory-col-actions">
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th><input id="memory-select-all" type="checkbox"></th>
                                            <th>类型</th>
                                            <th>内容</th>
                                            <th>重要度</th>
                                            <th>置信度</th>
                                            <th>状态</th>
                                            <th>最近使用</th>
                                            <th class="text-center">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="memory-list-body"></tbody>
                                </table>
                            </div>
                            <div id="pagination-memories" class="pagination"></div>
                        </div>
                        <div id="memory-edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="memory-edit-title" style="z-index: 5250;">
                            <div class="modal model-modal memory-modal memory-edit-modal">
                                <div class="model-modal-header memory-modal-header">
                                    <h3 id="memory-edit-title">编辑记忆</h3>
                                </div>
                                <form id="memory-edit-form" class="model-form memory-edit-form">
                                    <input type="hidden" id="memory-edit-id">
                                    <label class="form-item">
                                        <span>类型</span>
                                        <select id="memory-edit-type" class="form-input">
                                            <option value="preference">用户偏好</option>
                                            <option value="fact">项目事实</option>
                                            <option value="decision">长期决策</option>
                                            <option value="episode">历史片段</option>
                                        </select>
                                    </label>
                                    <label class="form-item memory-edit-content">
                                        <span>内容</span>
                                        <textarea id="memory-edit-content" class="form-input" rows="5" maxlength="800"></textarea>
                                    </label>
                                    <div class="model-form-row memory-edit-grid">
                                        <label class="form-item">
                                            <span>重要度</span>
                                            <input id="memory-edit-salience" class="form-input" type="number" min="0" max="1" step="0.05">
                                        </label>
                                        <label class="form-item">
                                            <span>置信度</span>
                                            <input id="memory-edit-confidence" class="form-input" type="number" min="0" max="1" step="0.05">
                                        </label>
                                    </div>
                                    <div class="model-form-row memory-edit-grid">
                                        <label class="form-item">
                                            <span>作用范围</span>
                                            <select id="memory-edit-scope" class="form-input">
                                                <option value="user">个人</option>
                                                <option value="project">项目</option>
                                                <option value="session">当前会话</option>
                                                <option value="global">全局</option>
                                            </select>
                                        </label>
                                        <label class="form-item">
                                            <span>项目或会话标识</span>
                                            <input id="memory-edit-scope-reference" class="form-input" maxlength="160">
                                        </label>
                                    </div>
                                    <div class="model-form-row memory-edit-grid">
                                        <label class="form-item">
                                            <span>生效时间</span>
                                            <input id="memory-edit-valid-from" class="form-input" type="datetime-local">

                                            <span>失效时间</span>
                                            <input id="memory-edit-expires-at" class="form-input" type="datetime-local">

                                    <div class="model-modal-actions memory-modal-actions">

                        <div id="memory-evaluations-modal" class="modal-overlay memory-evaluations-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="memory-evaluation-title">
                            <div class="modal model-modal memory-modal memory-evaluations-modal">
                                <div class="model-modal-header memory-modal-header">
                                    <div>
                                        <h3 id="memory-evaluation-title">检索评测</h3>
                                        <span class="memory-evaluation-subtitle">评测结果只反映当前账号的已授权记忆，不会发送记忆正文到外部评判服务。</span>
                                    </div>
                                    <div class="memory-evaluation-actions">
                                        <button id="memory-evaluation-run-btn" type="button" class="btn-primary">运行评测</button>
                                        <button id="memory-evaluation-refresh-btn" type="button" class="btn-secondary">刷新</button>
                                        <button id="memory-evaluations-close-btn" type="button" class="btn-secondary settings-close-btn">关闭</button>
                                    </div>
                                </div>
                                <div class="memory-evaluations-modal-body">
                                    <div class="memory-eval-highlights">
                                        <div class="memory-eval-highlight-item">
                                            <span class="highlight-icon">
                                                <svg class="highlight-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                            </span>
                                            <div class="highlight-content">
                                                <strong class="highlight-title">离线隐私无外发</strong>
                                                <span class="highlight-desc">仅在当前账号已授权记忆内检索比对，正文不发往第三方评判</span>
                                            </div>
                                        </div>
                                        <div class="memory-eval-highlight-item">
                                            <span class="highlight-icon">
                                                <svg class="highlight-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
                                            </span>
                                            <div class="highlight-content">
                                                <strong class="highlight-title">全链路多维基准</strong>
                                                <span class="highlight-desc">精准度量通过率、Recall@8、无关注入率及禁止召回违规率</span>
                                            </div>
                                        </div>
                                        <div class="memory-eval-highlight-item">
                                            <span class="highlight-icon">
                                                <svg class="highlight-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
                                            </span>
                                            <div class="highlight-content">
                                                <strong class="highlight-title">版本基线防退化</strong>
                                                <span class="highlight-desc">持久化用例与历次运行快照，杜绝策略或模型调整带来的效果退化</span>
                                            </div>
                                        </div>
                                    </div>
                                    <form id="memory-evaluation-case-form" class="memory-evaluation-case-form">
                                        <div class="memory-eval-form-head">
                                            <strong class="form-section-title">添加 / 编辑评测用例</strong>
                                            <span class="form-section-tip">设置检索问题与预期结果，建立当前账号的检索质量基准</span>
                                        </div>
                                        <input id="memory-evaluation-id" type="hidden">
                                        <div class="memory-eval-form-row">
                                            <label class="memory-eval-field field-name">
                                                <span class="field-label">用例名称</span>
                                                <input id="memory-evaluation-name" class="form-input" maxlength="180" placeholder="例如：用户偏好" required>
                                            </label>
                                            <label class="memory-eval-field field-query">
                                                <span class="field-label">测试问题 / 检索 Query</span>
                                                <input id="memory-evaluation-query" class="form-input" maxlength="4000" placeholder="例如：下次写代码用什么语言？" required>
                                            </label>

                                                <span class="field-label" title="期望召回记忆 ID，逗号分隔">期望记忆 ID</span>
                                                <input id="memory-evaluation-expected" class="form-input" inputmode="numeric" placeholder="如 1, 2">

                                                <input id="memory-evaluation-forbidden" class="form-input" inputmode="numeric" placeholder="如 3, 4">
                                            </label>
                                            <div class="memory-eval-field field-actions">
                                                <button id="memory-evaluation-reset-btn" type="button" class="btn-secondary" hidden>取消</button>
                                                <button type="submit" class="btn-primary">添加用例</button>
                                            </div>
                                        </div>
                                    </form>
                                    <div class="memory-eval-stats-section">

                                        <div id="memory-evaluation-summary" class="memory-evaluation-summary"></div>
                                        <div id="memory-evaluation-runs" class="memory-evaluation-runs"></div>
                                    </div>
                                    <div class="memory-eval-cases-section">
                                        <div class="memory-eval-cases-header">
                                            <span class="memory-eval-section-title">已保存评测用例</span>
                                        </div>
                                        <div id="memory-evaluation-cases" class="memory-evaluation-cases"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
