<!-- 模型管理 -->


<div id="tab-content-models" class="admin-tab-content hidden">
    <div class="settings-page-head">
        <div><h3>模型与评测</h3><p>管理模型服务，并以独立评测约束模型与策略发布。</p></div>
        <div class="settings-subnav" role="tablist" aria-label="模型管理分区">
            <button id="models-configuration-tab" type="button" class="settings-subtab active" role="tab" aria-controls="models-configuration-panel" aria-selected="true" tabindex="0" data-quality-tab="models" data-quality-section="configuration">模型配置</button>
            <button id="models-evaluation-tab" type="button" class="settings-subtab admin-only hidden" role="tab" aria-controls="decision-review-gold-panel" aria-selected="false" tabindex="-1" data-quality-tab="models" data-quality-section="evaluation">评测管理</button>
        </div>
    </div>
<section id="models-configuration-panel" role="tabpanel" aria-labelledby="models-configuration-tab" data-quality-panels="models" data-quality-panel="configuration">
                        <div class="settings-page-head">
                            <div>
                                <h3>模型配置</h3>
                                <p>管理聊天模型，以及全站共用的检索向量、重排序与 OCR 识别模型服务。</p>
                            </div>
                            <div class="settings-page-actions">
                                <button id="model-add-btn" type="button" class="btn-primary">+ 添加模型</button>
                            </div>
                        </div>
                        <section id="retrieval-model-services" class="retrieval-model-services" aria-labelledby="retrieval-model-services-title">
                            <div class="retrieval-model-services-head">
                                <div>
                                    <h4 id="retrieval-model-services-title">基础模型与算法服务</h4>
                                    <p>向量生成、重排序与 OCR 识别服务由系统统一维护；法规库、知识库与文档识别共用基础设施配置。</p>
                                </div>
                            </div>
                            <div id="retrieval-model-services-body" class="retrieval-model-services-body" aria-live="polite">
                                <div class="retrieval-model-service-card is-loading">正在读取基础模型服务状态…</div>
                            </div>
                        </section>
                        <div class="table-container models-table-wrap">
                            <table class="data-table compact-table models-table">
                                <colgroup>
                                    <col class="col-index">
                                    <col class="col-name">
                                    <col class="col-url">
                                    <col class="col-limit">
                                    <col class="col-capability">
                                    <col class="col-units">
                                    <col class="col-owner">
                                    <col class="col-status">
                                    <col class="col-created">
                                    <col class="col-actions">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th class="text-center">序号</th>
                                        <th>名称</th>
                                        <th>后端 URL</th>
                                        <th>每日额度</th>
                                        <th>能力</th>
                                        <th>可见部门</th>
                                        <th>添加用户</th>
                                        <th>状态</th>
                                        <th>添加时间</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="model-list-body"></tbody>
                            </table>
                        </div>
                        <div id="pagination-models" class="pagination"></div>
                    </section>
<section id="decision-review-gold-panel" class="decision-gold-review-tab hidden" role="tabpanel" aria-labelledby="models-evaluation-tab" aria-hidden="true" data-quality-panels="models" data-quality-panel="evaluation">
    <div class="settings-page-head">
        <div>
            <h3>冻结评测与金标审核 <span class="decision-gold-version-pill" id="decision-gold-active-version-badge" title="当前冻结评测集版本">v2</span></h3>
            <p>每个案例须由两名不同管理员独立得出一致结论。未经审核或存在分歧的案例继续阻断发布；本页不会自动激活模型或策略。</p>
        </div>
    </div>
<!-- @include partials/settings/decision-gold-review.html -->
</section>
</div>
