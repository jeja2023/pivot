<div id="app" class="hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="header-top">
                    <div class="app-brand-mini">
                        <img src="/common/logo.png" alt="Logo" class="brand-logo-mini">
                        <span class="brand-text-mini">智枢</span>
                    </div>
                    <button id="new-chat-btn" class="new-chat-circle-btn" title="发起新对话">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                </div>
                <div class="sidebar-tools">
                    <button id="session-search-open" class="sidebar-tool-btn sidebar-search-trigger" type="button" title="搜索会话">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                            stroke-width="2.3">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <span>搜索</span>
                    </button>
                    <button id="apps-workbench-btn" class="sidebar-tool-btn" data-workspace-view="apps" title="应用">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                            <path d="M14 17.5h7"></path>
                            <path d="M17.5 14v7"></path>
                        </svg>
                        <span>应用</span>
                    </button>
                    <button id="knowledge-workbench-btn" class="sidebar-tool-btn" data-workspace-view="knowledge" title="知识库">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path>
                            <path d="M8 7h8"></path>
                            <path d="M8 11h6"></path>
                        </svg>
                        <span>知识库</span>
                    </button>
                    <button id="mcp-workbench-btn" class="sidebar-tool-btn" data-workspace-view="mcp" title="工具箱">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                            <path d="M10 6.5h4"></path>
                            <path d="M6.5 10v4"></path>
                            <path d="M10 17.5h3.5a3.5 3.5 0 0 0 3.5-3.5V10"></path>
                        </svg>
                        <span>工具箱</span>
                    </button>
                    <button id="agent-workbench-btn" class="sidebar-tool-btn" data-workspace-view="agent" title="智能体">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4">
                            <path d="M12 2v4"></path>
                            <path d="M12 18v4"></path>
                            <path d="m4.93 4.93 2.83 2.83"></path>
                            <path d="m16.24 16.24 2.83 2.83"></path>
                            <path d="M2 12h4"></path>
                            <path d="M18 12h4"></path>
                            <path d="m4.93 19.07 2.83-2.83"></path>
                            <path d="m16.24 7.76 2.83-2.83"></path>
                            <circle cx="12" cy="12" r="4"></circle>
                        </svg>
                        <span>智能体</span>
                    </button>
                </div>
            </div>
            <div id="session-list" class="session-list"></div>
            <div class="sidebar-footer">
                <div class="footer-row">
                    <div class="footer-user" id="user-info-box">
                        <span class="user-avatar-dot"></span>
                        <span class="user-identity-text">
                            <span id="user-info" class="user-name-text"></span>
                        </span>
                        <span id="admin-tag" class="admin-badge hidden" title="系统管理员" aria-label="系统管理员">
                            <svg class="admin-badge-icon admin-badge-icon-super" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true">
                                <path d="M12 3 5 6v5c0 4.5 2.8 8.5 7 10 4.2-1.5 7-5.5 7-10V6l-7-3z" />
                                <path d="m9 12 2 2 4-5" />
                            </svg>
                            <svg class="admin-badge-icon admin-badge-icon-role" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                <circle cx="12" cy="8" r="3" />
                                <path d="M6 20c.7-3.1 2.8-5 6-5s5.3 1.9 6 5" />
                            </svg>
                        </span>
                    </div>
                    <div class="footer-btns">
                        <button id="manual-link-btn" class="footer-mini-btn" type="button" data-workspace-view="manual" title="打开帮助">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z" />
                                <path d="M8 7h8" />
                                <path d="M8 11h6" />
                            </svg>
                            <span>帮助</span>
                        </button>
                        <button id="admin-panel-btn" class="footer-mini-btn" data-workspace-view="settings" title="系统设置">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path
                                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <span>设置</span>
                        </button>
                        <button id="logout-btn" class="footer-mini-btn logout" title="退出登录">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            <span>退出</span>
                        </button>
                    </div>
                </div>
                <div class="copyright-text sidebar-copyright"></div>
            </div>
        </aside>

        <div id="session-search-modal" class="modal-overlay session-search-modal hidden" style="z-index: 1800;">
            <div class="modal session-search-dialog">
                <div class="session-search-head">
                    <div>
                        <h3>搜索会话</h3>
                        <p>按标题、内容或标签快速定位历史对话。</p>
                    </div>
                    <button id="session-search-close" class="btn-secondary btn-red-outline" type="button">关闭</button>
                </div>
                <div class="session-search-controls">
                    <div class="session-search-input-wrap">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="session-search-modal-input" class="form-input"
                            placeholder="搜索会话标题、消息内容，或输入 #标签">
                    </div>
                    <div class="tab-switcher-mini session-search-tabs">
                        <button id="session-search-modal-active" class="tab-btn-mini active" type="button">当前</button>
                        <button id="session-search-modal-archive" class="tab-btn-mini" type="button">归档</button>
                    </div>
                    <div id="session-batch-slot" class="session-batch-slot"></div>
                </div>
                <div id="session-search-modal-results" class="session-search-results"></div>
                <div id="session-search-modal-status" class="session-search-status"></div>
            </div>
        </div>

        <main class="chat-container">
            <section id="chat-workspace-view" class="main-workspace-view chat-workspace-view">
            <header class="chat-header">
                <div class="header-left" style="display: flex; align-items: center; gap: 12px;">
                    <button id="sidebar-toggle-btn" class="icon-btn" title="切换侧边栏">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <h3 id="current-title">请选择或新建对话</h3>
                </div>
                <div class="header-right">

                    <div id="model-selector-container" class="model-dropdown-container">
                        <input type="hidden" id="model-selector">
                        <button id="model-selector-btn" class="model-selector-trigger">
                            <span id="selected-model-name">正在加载...</span>
                            <div id="selected-model-caps" class="selected-caps"></div>
                            <svg class="chevron-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="model-dropdown-list" class="model-dropdown-list hidden">
                            <!-- 动态填充模型列表 -->
                        </div>
                    </div>
                </div>
            </header>
            <div id="message-container" class="message-container"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <!-- 附件预览区域 -->
                    <div id="attachment-preview" class="attachment-preview hidden"></div>
                    <input type="file" id="file-input" class="hidden" multiple
                        accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx">
                    <textarea id="user-input" class="form-input" placeholder="输入消息..."></textarea>
                    <div class="input-actions left">
                        <button id="upload-btn" class="btn-icon has-tooltip" data-tooltip="上传附件，支持图片、PDF、Word、Excel、文本">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                            </svg>
                        </button>
                        <button type="button" id="chat-rag-enabled" class="chat-tool-toggle chat-tool-rag" data-chat-tool-toggle="rag" data-tooltip="让知识库参与本轮回答" aria-label="让知识库参与本轮回答" aria-pressed="false">
                            <span class="chat-tool-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path>
                                    <path d="M8 7h8"></path>
                                    <path d="M8 11h6"></path>
                                </svg>
                            </span>
                        </button>
                        <select id="chat-rag-collection-scope" class="form-input chat-rag-scope hidden" title="知识库范围" aria-label="知识库范围" aria-hidden="true" disabled>
                            <option value="">全部知识库</option>
                        </select>
                        <select id="chat-rag-tag-scope" class="form-input chat-rag-scope hidden" title="知识库标签" aria-label="知识库标签" aria-hidden="true" disabled>
                            <option value="">全部标签</option>
                        </select>
                        <button type="button" id="chat-mcp-enabled" class="chat-tool-toggle chat-tool-mcp" data-chat-tool-toggle="mcp" data-tooltip="允许本轮对话按需调用工具箱工具" aria-label="允许本轮对话按需调用工具箱工具" aria-pressed="false">
                            <span class="chat-tool-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                                    <path d="M10 6.5h4"></path>
                                    <path d="M6.5 10v4"></path>
                                    <path d="M10 17.5h3.5a3.5 3.5 0 0 0 3.5-3.5V10"></path>
                                </svg>
                            </span>
                        </button>
                        <button type="button" id="chat-prompt-library-btn" class="btn-icon has-tooltip chat-prompt-library-btn" data-tooltip="套用提示词" aria-label="套用提示词">
                            <span class="chat-tool-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path>
                                    <path d="M8 7h8"></path>
                                    <path d="M8 11h6"></path>
                                    <path d="M8 15h5"></path>
                                </svg>
                            </span>
                        </button>
                        <div id="chat-tool-status" class="chat-tool-status hidden" aria-live="polite"></div>
                    </div>
                    <div class="input-actions right">
                        <button type="button" id="context-usage-pill" class="context-usage-btn has-tooltip" title="当前会话上下文用量，点击手动压缩" data-tooltip="上下文用量: -">
                            <div class="context-mini-ring" id="context-usage-ring" style="--progress: 0;"></div>
                        </button>
                        <button id="clear-input-btn" class="btn-icon has-tooltip" data-tooltip="清空输入框">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 3h10v5H7z"></path>
                                <path d="M10.5 3v5"></path>
                                <path d="M13.5 3v5"></path>
                                <path d="M5 8h14a1 1 0 0 1 1 1v1a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1Z"></path>
                                <path d="M12 12v8"></path>
                                <path d="M10 20h4"></path>
                            </svg>
                        </button>
                        <button id="stop-btn" class="btn-danger hidden" title="停止生成">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="5" y="5" width="14" height="14" rx="2" />
                            </svg>
                        </button>
                        <button id="send-btn" class="btn-primary" title="发送 (Enter)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            </section>
        </main>
    </div>
