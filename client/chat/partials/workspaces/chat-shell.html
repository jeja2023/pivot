<div id="app" class="hidden">
        <aside class="sidebar">

                            <line x1="5" y1="12" x2="19" y2="12" />

                    <button id="session-search-open" class="sidebar-tool-btn sidebar-search-trigger" type="button" title="搜索会话 (⌘K)">

                            <circle cx="11" cy="11" r="8" />

                    <div class="sidebar-tools-collapsed hidden" aria-hidden="true" style="display: none !important;">
                        <button id="apps-workbench-btn" class="sidebar-tool-btn" data-workspace-view="apps" title="应用" tabindex="-1"><span>应用</span></button>
                        <button id="knowledge-workbench-btn" class="sidebar-tool-btn" data-workspace-view="knowledge" title="知识库" tabindex="-1"><span>知识库</span></button>
                        <button id="mcp-workbench-btn" class="sidebar-tool-btn" data-workspace-view="mcp" title="工具库" tabindex="-1"><span>工具库</span></button>
                        <button id="automation-workbench-btn" class="sidebar-tool-btn" data-workspace-view="automation" title="自动化" tabindex="-1"><span>自动化</span></button>
                    </div>
                </div>
            </div>
            <div class="sidebar-session-section-label">最近会话</div>
            <div id="session-list" class="session-list"></div>
            <div class="sidebar-footer hidden" aria-hidden="true" style="display: none !important;">
                <div class="footer-row">
                    <div class="footer-user" id="user-info-box">
                        <span class="user-avatar-dot"></span>
                        <span class="user-identity-text">
                            <span id="user-info" class="user-name-text"></span>
                        </span>
                        <span id="admin-tag" class="admin-badge" title="用户" aria-label="用户">
                            <svg class="admin-badge-icon admin-badge-icon-super" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                                <path d="m9 12 2 2 4-4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <svg class="admin-badge-icon admin-badge-icon-role" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true">
                                <circle cx="9" cy="7" r="4" />
                                <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                                <path d="m15 11 2 2 4-4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <svg class="admin-badge-icon admin-badge-icon-user" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true">
                                <circle cx="12" cy="7" r="4" />
                                <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
                            </svg>
                        </span>
                    </div>
                    <div class="footer-btns">
                        <button id="manual-link-btn" class="footer-mini-btn" type="button" data-workspace-view="manual" title="打开帮助">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z" />
                                <path d="M8 7h8" />
                                <path d="M8 11h6" />
                            </svg>
                            <span>帮助</span>
                        </button>
                        <button id="admin-panel-btn" class="footer-mini-btn" data-workspace-view="settings" title="设置">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path
                                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <span>设置</span>
                        </button>
                        <button id="logout-btn" class="footer-mini-btn logout" title="退出登录">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            <span>退出</span>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <div id="session-search-modal" class="modal-overlay session-search-modal hidden" style="z-index: 1800;" aria-hidden="true">
            <div class="modal session-search-dialog" role="dialog" aria-modal="true" aria-labelledby="session-search-title">
                <div class="session-search-head">
                    <div>
                        <h3 id="session-search-title">全局搜索</h3>
                        <p id="session-search-subtitle">搜索会话、任务和工作流。</p>
                    </div>
                    <button id="session-search-close" class="btn-secondary btn-red-outline" type="button">关闭</button>
                </div>
                <div class="global-search-types" role="tablist" aria-label="搜索范围">
                    <button id="global-search-tab-sessions" class="global-search-type active" type="button" data-global-search-type="sessions" role="tab" aria-controls="session-search-modal-results" aria-selected="true">会话</button>
                    <button id="global-search-tab-tasks" class="global-search-type" type="button" data-global-search-type="tasks" role="tab" aria-controls="session-search-modal-results" aria-selected="false" tabindex="-1">任务</button>
                    <button id="global-search-tab-workflows" class="global-search-type" type="button" data-global-search-type="workflows" role="tab" aria-controls="session-search-modal-results" aria-selected="false" tabindex="-1">工作流</button>
                </div>
                <div class="session-search-controls">
                    <div class="session-search-input-wrap">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="search" id="session-search-modal-input" class="form-input" autocomplete="off" spellcheck="false"
                            placeholder="搜索会话标题、消息内容，或输入 #标签">
                        <button id="session-search-modal-clear" class="session-search-clear hidden" type="button" aria-label="清空搜索" title="清空搜索">
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                    </div>
                    <div id="session-search-scope" class="session-search-scope">
                        <div class="tab-switcher-mini session-search-tabs">
                            <button id="session-search-modal-active" class="tab-btn-mini active" type="button" aria-selected="true">当前</button>
                            <button id="session-search-modal-archive" class="tab-btn-mini" type="button" aria-selected="false">归档</button>
                        </div>
                        <div id="session-batch-slot" class="session-batch-slot"></div>
                    </div>
                </div>
                <div id="session-search-modal-results" class="session-search-results" role="list" aria-live="polite" aria-busy="false"></div>
                <div id="session-search-modal-status" class="session-search-status" role="status" aria-live="polite"></div>
            </div>
        </div>

        <main class="chat-container">
            <section id="chat-workspace-view" class="main-workspace-view chat-workspace-view">
            <header class="chat-header">
                <div class="header-left" style="display: flex; align-items: center; gap: 12px;">
                    <button id="sidebar-toggle-btn" class="icon-btn" title="切换侧边栏">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <h3 id="current-title">请选择或新建对话</h3>
                </div>
            </header>
            <div id="message-container" class="message-container"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <!-- 附件预览区域 -->
                    <div id="attachment-preview" class="attachment-preview hidden"></div>
                    <input type="file" id="file-input" class="hidden" multiple
                        accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx">
                    <input type="file" id="folder-input" class="hidden" webkitdirectory directory multiple
                        accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx">
                    <textarea id="user-input" class="form-input" placeholder="输入消息… 需要指定资料或工具时可输入 @"></textarea>
                    <div id="chat-route-mention-menu" class="chat-route-mention-menu" role="listbox" aria-label="选择知识库或工具" hidden></div>
                    <div class="input-actions left">
                        <div id="chat-tools-menu" class="chat-tools-menu">
                        <button type="button" id="chat-tools-menu-btn" class="btn-secondary chat-tools-menu-trigger" aria-label="添加文件或文件夹" aria-expanded="false" aria-controls="chat-tools-menu-panel" title="添加文件或文件夹">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                        </button>
                        <div id="chat-tools-menu-panel" class="chat-tools-menu-panel chat-attachment-menu-panel" role="menu" aria-label="添加文件或文件夹" hidden>
                            <button type="button" id="upload-file-choice" class="btn-secondary chat-tool-subpanel-item" role="menuitem">选择文件</button>
                            <button type="button" id="upload-folder-choice" class="btn-secondary chat-tool-subpanel-item" role="menuitem">选择文件夹</button>
                        </div>
                        </div>
                        <div id="chat-memory-menu" class="chat-tools-menu">
                            <button type="button" id="chat-memory-menu-btn" class="btn-secondary chat-tools-menu-trigger" aria-label="记忆操作" aria-expanded="false" aria-controls="chat-memory-menu-panel" title="记忆操作">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5A5.5 5.5 0 0 0 4 9v1a3 3 0 0 0 0 6v1a3 3 0 0 0 3 3h2"></path><path d="M14.5 3.5A5.5 5.5 0 0 1 20 9v1a3 3 0 0 1 0 6v1a3 3 0 0 1-3 3h-2"></path><path d="M9 12h6M12 9v6"></path></svg>
                            </button>
                            <div id="chat-memory-menu-panel" class="chat-tools-menu-panel chat-memory-menu-panel" role="menu" aria-label="记忆操作" hidden>
                                <button type="button" id="chat-remember-input" class="btn-secondary chat-tool-subpanel-item" role="menuitem">记住当前输入</button>
                                <button type="button" id="chat-memory-intent" class="btn-secondary chat-tool-subpanel-item" role="menuitem">用自然语言更正或忘记</button>
                                <button type="button" id="chat-open-memories" class="btn-secondary chat-tool-subpanel-item" role="menuitem">查看和管理记忆</button>
                            </div>
                        </div>
                        <button type="button" id="chat-voice-input" class="btn-secondary chat-tools-menu-trigger" aria-label="语音输入" aria-pressed="false" title="语音输入（浏览器本地转写，不会上传录音）">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"></path></svg>
                        </button>
                        <button type="button" id="chat-realtime-voice" class="btn-secondary chat-tools-menu-trigger" aria-label="实时语音" aria-pressed="false" title="启动实时语音">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path><path d="M4.93 19.07l2.83-2.83"></path><path d="M16.24 7.76l2.83-2.83"></path><circle cx="12" cy="12" r="4"></circle></svg>
                        </button>
                        <div id="chat-route-override-state" hidden aria-hidden="true">
                            <select id="chat-rag-collection-scope" class="form-input" disabled tabindex="-1"><option value="">全部知识库</option></select>
                            <select id="chat-rag-tag-scope" class="form-input" disabled tabindex="-1"><option value="">全部标签</option></select>
                        </div>
                        <div id="chat-mode-selector" class="chat-mode-selector">
                            <button type="button" id="chat-mode-trigger" class="chat-mode-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="chat-mode-panel" title="切换回答模式">
                                <span id="chat-mode-label">普通</span>
                            </button>
                            <div id="chat-mode-panel" class="chat-mode-panel" role="listbox" aria-label="回答模式" hidden>
                                <button type="button" class="chat-mode-option" data-chat-mode-option="normal" role="option" aria-selected="true">
                                    <strong>普通</strong><small>快速回答</small>
                                </button>
                                <button type="button" id="chat-agent-mode-option" class="chat-mode-option" data-chat-mode-option="agent" role="option" aria-selected="false">
                                    <strong>Agent</strong><small id="chat-agent-mode-hint">连续规划和工具执行</small>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="input-actions right">
                        <button type="button" id="context-usage-pill" class="context-usage-btn has-tooltip" data-tooltip="上下文用量: -" aria-label="当前会话上下文用量，点击手动压缩">
                            <div class="context-mini-ring" id="context-usage-ring" style="--progress: 0;"></div>
                        </button>
                        <div id="model-selector-container" class="model-dropdown-container input-model-selector">
                            <input type="hidden" id="model-selector">
                            <button id="model-selector-btn" class="model-selector-trigger" type="button" title="切换模型">
                                <span id="selected-model-name">正在加载...</span>
                            </button>
                            <div id="model-dropdown-list" class="model-dropdown-list hidden">
                                <!-- 动态填充模型列表 -->
                            </div>
                        </div>
                        <button id="stop-btn" class="btn-danger hidden" title="停止生成">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="5" y="5" width="14" height="14" rx="2" />
                            </svg>
                        </button>
                        <button id="send-btn" class="btn-primary" title="发送 (Enter)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            </section>
        </main>
    </div>
    <div id="chat-memory-intent-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="chat-memory-intent-title">
        <div class="modal chat-memory-intent-dialog">
            <div class="chat-memory-intent-head"><div><h3 id="chat-memory-intent-title">管理个人记忆</h3><p>例如“记住我偏好简洁摘要”“忘记项目代号”“更正旧偏好为新偏好”。系统会先预览，确认后才修改。</p></div><button type="button" id="chat-memory-intent-close" class="btn-secondary">关闭</button></div>
            <label class="chat-memory-intent-field"><span>自然语言操作</span><textarea id="chat-memory-intent-text" class="form-input" rows="3" maxlength="2400" placeholder="输入记住、忘记或更正指令"></textarea></label>
            <div id="chat-memory-intent-preview" class="chat-memory-intent-preview hidden" aria-live="polite"></div>
            <div class="chat-memory-intent-actions"><button type="button" id="chat-memory-intent-preview-btn" class="btn-secondary">预览操作</button><button type="button" id="chat-memory-intent-apply" class="btn-primary" disabled>确认修改</button></div>
        </div>
    </div>
