            <div class="sidebar-session-section-label">最近会话</div>

                    <div class="footer-btns">

                                <circle cx="12" cy="12" r="3" />

                            <span>设置</span>
                        </button>
                        <button id="logout-btn" class="footer-mini-btn logout" title="退出登录">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />

                            <span>退出</span>

                    </div>
                </div>
            </div>
        </aside>

        <div id="session-search-modal" class="modal-overlay session-search-modal hidden" style="z-index: 1800;" aria-hidden="true">
            <div class="modal session-search-dialog" role="dialog" aria-modal="true" aria-labelledby="session-search-title">
                <div class="session-search-head">
                    <div>
                        <h3 id="session-search-title">全局搜索</h3>
                        <p>搜索会话、任务和工作流。</p>
                    </div>
                    <button id="session-search-close" class="btn-secondary btn-red-outline" type="button">关闭</button>
                </div>
                <div class="global-search-types" role="tablist" aria-label="搜索范围">
                    <button id="global-search-tab-sessions" class="global-search-type active" type="button" data-global-search-type="sessions" role="tab" aria-controls="session-search-modal-results" aria-selected="true">会话</button>
                    <button id="global-search-tab-tasks" class="global-search-type" type="button" data-global-search-type="tasks" role="tab" aria-controls="session-search-modal-results" aria-selected="false" tabindex="-1">任务</button>
                    <button id="global-search-tab-workflows" class="global-search-type" type="button" data-global-search-type="workflows" role="tab" aria-controls="session-search-modal-results" aria-selected="false" tabindex="-1">工作流</button>
                </div>
                <div class="session-search-controls">
                    <div class="session-search-input-wrap">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="search" id="session-search-modal-input" class="form-input" autocomplete="off" spellcheck="false"
                            placeholder="搜索会话标题、消息内容，或输入 #标签">
                        <button id="session-search-modal-clear" class="session-search-clear hidden" type="button" aria-label="清空搜索" title="清空搜索">
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                    </div>
                    <div id="session-search-scope" class="session-search-scope">
                        <div class="tab-switcher-mini session-search-tabs">
                            <button id="session-search-modal-active" class="tab-btn-mini active" type="button" aria-selected="true">当前</button>
                            <button id="session-search-modal-archive" class="tab-btn-mini" type="button" aria-selected="false">归档</button>
                        </div>
                        <div id="session-batch-slot" class="session-batch-slot"></div>
                    </div>
                </div>
                <div id="session-search-modal-results" class="session-search-results" role="list" aria-live="polite" aria-busy="false"></div>
                <div id="session-search-modal-status" class="session-search-status" role="status" aria-live="polite"></div>
            </div>
        </div>

        <main class="chat-container">
            <section id="chat-workspace-view" class="main-workspace-view chat-workspace-view">
            <header class="chat-header">
                <div class="header-left" style="display: flex; align-items: center; gap: 12px;">
                    <button id="sidebar-toggle-btn" class="icon-btn" title="切换侧边栏">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <h3 id="current-title">请选择或新建对话</h3>
                </div>
            </header>
            <div id="message-container" class="message-container"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <!-- 附件预览区域 -->
                    <div id="attachment-preview" class="attachment-preview hidden"></div>
                    <input type="file" id="file-input" class="hidden" multiple
                        accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx">
                    <input type="file" id="folder-input" class="hidden" webkitdirectory directory multiple
                        accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx">
                    <textarea id="user-input" class="form-input" placeholder="输入消息..."></textarea>
                    <div class="input-actions left">
                        <div id="chat-tools-menu" class="chat-tools-menu">
                        <button type="button" id="chat-tools-menu-btn" class="btn-secondary chat-tools-menu-trigger" aria-label="添加附件、工具或知识库" aria-expanded="false" aria-controls="chat-tools-menu-panel" title="添加">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                        </button>
                        <div id="chat-tools-menu-panel" class="chat-tools-menu-panel" role="menu" aria-label="添加选项" hidden>
                        <div class="chat-tool-entry chat-upload-entry">
                        <button type="button" id="upload-btn" class="btn-secondary btn-icon has-tooltip chat-tool-menu-item" data-menu-label="文件和文件夹" data-menu-description="选择文件或整个文件夹" data-tooltip="上传文件或文件夹中的支持文件" aria-expanded="false" aria-controls="upload-choice-panel">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                            </svg>
                        </button>
                        <div id="upload-choice-panel" class="chat-tool-subpanel upload-choice-panel" role="menu" aria-label="上传方式" hidden>
                            <button type="button" id="upload-file-choice" class="btn-secondary chat-tool-subpanel-item" role="menuitem">选择文件</button>
                            <button type="button" id="upload-folder-choice" class="btn-secondary chat-tool-subpanel-item" role="menuitem">选择文件夹</button>
                        </div>
                        </div>
                        <div class="chat-tool-entry chat-rag-entry">
                        <button type="button" id="chat-rag-enabled" class="btn-secondary chat-tool-toggle chat-tool-rag chat-tool-menu-item" data-chat-tool-toggle="rag" data-menu-label="知识库" data-menu-description="让知识库参与本轮回答" data-tooltip="让知识库参与本轮回答" aria-label="让知识库参与本轮回答" aria-pressed="false">
                            <span class="chat-tool-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path>
                                    <path d="M8 7h8"></path>
                                    <path d="M8 11h6"></path>
                                </svg>
                            </span>
                        </button>
                        <button type="button" class="btn-secondary chat-tool-config-trigger" data-chat-tool-config="rag" aria-label="筛选知识库" aria-expanded="false">›</button>
                        <div id="chat-rag-subpanel" class="chat-tool-subpanel chat-rag-subpanel" role="region" aria-label="知识库筛选" hidden>
                        <div id="chat-rag-readiness" class="chat-tool-subpanel-status is-checking" aria-live="polite">正在检查知识库...</div>
                        <input id="chat-rag-scope-search" class="form-input chat-tool-filter-input" type="search" placeholder="搜索知识库" aria-label="搜索知识库">
                        <select id="chat-rag-collection-scope" class="form-input chat-rag-scope hidden" title="知识库范围" aria-label="知识库范围" aria-hidden="true" disabled>
                            <option value="">全部知识库</option>
                        </select>
                        <select id="chat-rag-tag-scope" class="form-input chat-rag-scope hidden" title="知识库标签" aria-label="知识库标签" aria-hidden="true" disabled>
                            <option value="">全部标签</option>
                        </select>
                        <div class="chat-tool-subpanel-hint">可按知识库和标签缩小本轮检索范围</div>
                        <div class="chat-tool-subpanel-actions"><button type="button" class="btn-secondary" data-chat-tool-reset="rag">重置</button><button type="button" class="btn-primary" data-chat-tool-done="rag">完成</button></div>
                        </div>
                        </div>
                        <div class="chat-tool-entry chat-mcp-entry">
                        <button type="button" id="chat-mcp-enabled" class="btn-secondary chat-tool-toggle chat-tool-mcp chat-tool-menu-item" data-menu-label="工具" data-menu-description="按需调用工具库能力" data-chat-tool-toggle="mcp" data-tooltip="允许本轮对话按需调用工具库工具" aria-label="允许本轮对话按需调用工具库工具" aria-pressed="false">
                            <span class="chat-tool-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                                    <path d="M10 6.5h4"></path>
                                    <path d="M6.5 10v4"></path>
                                    <path d="M10 17.5h3.5a3.5 3.5 0 0 0 3.5-3.5V10"></path>
                                </svg>
                            </span>
                        </button>
                        <button type="button" class="btn-secondary chat-tool-config-trigger" data-chat-tool-config="mcp" aria-label="筛选工具" aria-expanded="false">›</button>
                        <div id="chat-mcp-subpanel" class="chat-tool-subpanel chat-mcp-subpanel" role="region" aria-label="工具筛选" hidden>
                            <div class="chat-tool-mode-options" role="radiogroup" aria-label="工具选择方式">
                                <label class="chat-tool-mode-option">
                                    <input id="chat-mcp-mode-auto" type="radio" name="chat-mcp-mode" value="auto" checked>
                                    <span><strong>模型自动选择</strong><small>根据问题从可用工具中按需调用</small></span>
                                </label>
                                <label class="chat-tool-mode-option">
                                    <input id="chat-mcp-mode-manual" type="radio" name="chat-mcp-mode" value="manual">
                                    <span><strong>手动限制范围</strong><small>仅允许模型使用勾选的工具</small></span>
                                </label>
                            </div>
                            <div id="chat-mcp-tool-summary" class="chat-tool-subpanel-status chat-mcp-selection-summary" aria-live="polite">模型将按需选择可用工具</div>
                            <div id="chat-mcp-manual-controls" class="chat-mcp-manual-controls" hidden>
                                <input id="chat-mcp-tool-search" class="form-input chat-tool-filter-input" type="search" placeholder="搜索工具" aria-label="搜索工具">
                                <label class="chat-tool-all-row"><input id="chat-mcp-all-tools" type="checkbox"> 选择全部</label>
                                <div id="chat-mcp-tool-list" class="chat-mcp-tool-list"><div class="chat-tool-subpanel-hint">展开后加载工具列表</div></div>
                            </div>
                            <div class="chat-tool-subpanel-actions"><button type="button" class="btn-secondary" data-chat-tool-reset="mcp">重置</button><button type="button" class="btn-primary" data-chat-tool-done="mcp">完成</button></div>
                        </div>
                        </div>
                        <div id="chat-tool-status" class="chat-tool-status hidden" aria-live="polite"></div>
                        </div>
                        </div>
                        <div id="chat-mode-selector" class="chat-mode-selector">
                            <button type="button" id="chat-mode-trigger" class="chat-mode-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="chat-mode-panel" title="切换回答模式">
                                <span id="chat-mode-label">普通</span>
                            </button>
                            <div id="chat-mode-panel" class="chat-mode-panel" role="listbox" aria-label="回答模式" hidden>
                                <button type="button" class="chat-mode-option" data-chat-mode-option="normal" role="option" aria-selected="true">
                                    <strong>普通</strong><small>快速回答</small>
                                </button>
                                <button type="button" id="chat-agent-mode-option" class="chat-mode-option" data-chat-mode-option="agent" role="option" aria-selected="false">
                                    <strong>Agent</strong><small id="chat-agent-mode-hint">连续规划和工具执行</small>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="input-actions right">
                        <button type="button" id="context-usage-pill" class="context-usage-btn has-tooltip" data-tooltip="上下文用量: -" aria-label="当前会话上下文用量，点击手动压缩">
                            <div class="context-mini-ring" id="context-usage-ring" style="--progress: 0;"></div>
                        </button>
                        <div id="model-selector-container" class="model-dropdown-container input-model-selector">
                            <input type="hidden" id="model-selector">
                            <button id="model-selector-btn" class="model-selector-trigger" type="button" title="切换模型">
                                <span id="selected-model-name">正在加载...</span>
                            </button>
                            <div id="model-dropdown-list" class="model-dropdown-list hidden">
                                <!-- 动态填充模型列表 -->
                            </div>
                        </div>
                        <button id="stop-btn" class="btn-danger hidden" title="停止生成">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="5" y="5" width="14" height="14" rx="2" />
                            </svg>
                        </button>
                        <button id="send-btn" class="btn-primary" title="发送 (Enter)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            </section>
        </main>
    </div>
