<!-- 自动化资产中心与工作流编排器 -->
    <section id="agent-dag-workbench-modal" class="main-workspace-view agent-dag-workspace-view hidden">
        <div class="agent-dag-modal">
            <div class="agent-dag-modal-header">
                <div>
                    <h3 id="automation-workspace-title">自动化</h3>
                    <p id="automation-workspace-description">集中管理工作流与计划任务，并跟踪发布和运行状态。</p>
                </div>
                <div class="agent-dag-header-actions">
                    <button id="automation-refresh-btn" class="btn-secondary" type="button">刷新</button>
                    <button id="agent-dag-save-btn" class="btn-primary hidden" type="button">保存</button>
                    <button id="agent-workflow-dependency-btn" class="btn-secondary hidden" type="button">配置依赖</button>
                    <button id="agent-workflow-triggers-btn" class="btn-secondary hidden" type="button">自动启动</button>
                    <button id="agent-workflow-readonly-run-btn" class="btn-primary hidden" type="button">运行发布版</button>
                    <button id="agent-dag-back-btn" class="btn-secondary hidden" type="button">返回资产中心</button>
                    <button id="automation-close-btn" class="btn-secondary agent-modal-close" type="button">关闭</button>
                </div>
            </div>
            <div class="automation-primary-tabs" role="tablist" aria-label="自动化功能">
                <button class="automation-primary-tab" type="button" data-automation-section="tasks" role="tab" aria-controls="agent-workbench-modal" aria-selected="false" tabindex="-1">任务</button>
                <button class="automation-primary-tab active" type="button" data-automation-section="workflows" role="tab" aria-controls="automation-workflows-panel" aria-selected="true" tabindex="0">工作流</button>
                <button class="automation-primary-tab" type="button" data-automation-section="workbench" role="tab" aria-controls="agent-control-plane" aria-selected="false" tabindex="-1">Agent 控制台</button>
            </div>
            <div id="automation-assets-view" class="automation-assets-view">
                <div class="automation-summary-grid" aria-label="自动化资产概览">
                    <div class="automation-summary-item">
                        <span>工作流</span>
                        <strong id="automation-workflow-count">0</strong>
                        <small>已保存资产</small>
                    </div>
                    <div class="automation-summary-item">
                        <span>已发布</span>
                        <strong id="automation-published-count">0</strong>
                        <small>可稳定运行</small>
                    </div>
                    <div class="automation-summary-item">
                        <span>已启用计划</span>
                        <strong id="automation-schedule-count">0</strong>
                        <small>自动执行</small>
                    </div>
                </div>
                <div class="automation-assets-toolbar">
                    <div class="automation-assets-search">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                        <input id="automation-assets-search-input" class="form-input" type="search" placeholder="搜索工作流" autocomplete="off">
                    </div>
                    <div class="automation-assets-actions">
                        <button id="automation-new-workflow-btn" class="btn-primary btn-xs" type="button">新建工作流</button>
                        <button id="automation-new-schedule-btn" class="btn-secondary btn-xs hidden" type="button">新建计划</button>
                    </div>
                </div>
                <div id="automation-workflows-panel" class="automation-assets-panel" role="tabpanel" aria-label="工作流列表" aria-hidden="false">
                    <div id="automation-workflow-assets-list" class="automation-assets-list"></div>
                </div>
                <div id="automation-schedules-panel" class="automation-assets-panel hidden" role="tabpanel" aria-label="计划任务列表" aria-hidden="true">
                    <div id="automation-schedule-assets-list" class="automation-assets-list"></div>
                </div>
            </div>
            <div id="automation-editor-view" class="automation-editor-view hidden">
            <div class="agent-dag-library-bar" aria-label="工作流库与状态">
                <button id="agent-workflow-new-btn" class="btn-secondary agent-dag-new-btn" type="button" title="清空画布并新建工作流">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    <span>新建</span>
                </button>
                <div id="agent-workflow-picker" class="agent-workflow-picker" role="group" aria-label="当前工作流与工作流库">
                    <button id="agent-workflow-picker-trigger" class="agent-workflow-picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="agent-workflow-picker-menu">
                        <span class="agent-workflow-picker-trigger-copy">
                            <strong id="agent-workflow-picker-title">新建工作流</strong>
                            <small id="agent-workflow-picker-meta">点击切换已保存工作流</small>
                        </span>
                        <span class="agent-workflow-picker-caret" aria-hidden="true">⌄</span>
                    </button>
                    <div id="agent-workflow-picker-menu" class="agent-workflow-picker-menu hidden" role="presentation">
                        <input id="agent-workflow-picker-search" class="form-input agent-workflow-picker-search" autocomplete="off" placeholder="搜索工作流名称、版本、节点数" aria-label="搜索已保存工作流">
                        <div id="agent-workflow-picker-list" class="agent-workflow-picker-list" role="listbox" aria-label="已保存工作流列表"></div>
                    </div>
                    <select id="agent-workflow-select" class="form-input agent-workflow-native-select" aria-label="已保存工作流">
                        <option value="">选择已保存工作流</option>
                    </select>
                </div>
                <div id="agent-workflow-lifecycle" class="agent-workflow-lifecycle" aria-live="polite"></div>
                <details id="agent-workflow-management-menu" class="agent-workflow-management-menu">
                    <summary class="btn-secondary agent-workflow-management-trigger" aria-label="更多工作流操作" title="更多工作流操作">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    </summary>
                    <div class="agent-workflow-management-popover" role="menu">
                        <button id="agent-workflow-versions-btn" class="agent-workflow-management-item" type="button" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
                            <span>版本历史</span>
                        </button>
                        <button id="agent-workflow-schedule-btn" class="agent-workflow-management-item" type="button" role="menuitem" disabled title="发布工作流后可创建计划任务">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                            <span>计划任务</span>
                        </button>
                        <button id="agent-workflow-share-btn" class="agent-workflow-management-item" type="button" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
                            <span>分享工作流</span>
                        </button>
                        <button id="agent-workflow-delete-btn" class="agent-workflow-management-item is-danger" type="button" role="menuitem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>
                            <span>删除工作流</span>
                        </button>
                    </div>
                </details>
            </div>
            <section id="agent-dag-inputs-panel" class="agent-dag-inputs-panel hidden" aria-labelledby="agent-dag-inputs-title">
                <div class="agent-dag-inputs-head">
                    <div>
                        <strong id="agent-dag-inputs-title">运行输入</strong>
                        <span>预览和运行当前工作流时使用</span>
                    </div>
                    <button id="agent-dag-inputs-refresh" class="btn-secondary" type="button" title="重新读取输入节点">刷新</button>
                </div>
                <div id="agent-dag-inputs-list" class="agent-dag-inputs-list"></div>
            </section>
            <div class="agent-dag-workbench">
                <div class="pivot-dag-editor-wrap" id="agent-dag-editor-wrap">
                    <div class="pivot-dag-editor-toolbar" id="agent-dag-editor-toolbar"></div>
                    <div class="pivot-dag-editor-canvas" id="agent-dag-editor-canvas"></div>
                </div>
                <aside id="agent-dag-node-drawer" class="agent-dag-node-drawer hidden" aria-hidden="true">
                    <div class="agent-dag-node-drawer-panel">
                        <div class="agent-dag-drawer-head">
                            <div>
                                <h3 id="agent-dag-node-drawer-title">节点配置</h3>
                                <span id="agent-dag-node-drawer-subtitle"></span>
                            </div>
                            <div class="agent-dag-drawer-actions">
                                <button id="agent-dag-node-drawer-delete" class="btn-danger-outline" type="button">删除</button>
                                <button id="agent-dag-node-drawer-close" class="btn-secondary" type="button">关闭</button>
                            </div>
                        </div>
                        <div class="pivot-dag-editor-inspector" id="agent-dag-editor-inspector"></div>
                    </div>
                </aside>
            </div>
            </div>
            <div id="agent-dag-json-modal" class="modal-overlay hidden agent-dag-json-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="agent-dag-json-title" style="z-index: 1920;">
                <div class="modal agent-dag-json-modal" role="document">
                    <div class="agent-dag-json-head">
                <h3 id="agent-dag-json-title">原始配置（高级）</h3>
                        <div class="agent-dag-json-actions">
                            <button id="agent-dag-json-apply-btn" class="btn-primary" type="button">同步到画布</button>
                            <button id="agent-dag-json-close-btn" class="btn-secondary" type="button">关闭</button>
                        </div>
                    </div>
                    <textarea id="agent-dag-spec" class="form-input agent-dag-spec" placeholder='{"nodes":[{"id":"search","title":"检索资料","tool":"rag.search","input":{"query":"..."}},{"id":"summary","title":"整理结果","tool":"sessions.recent","dependsOn":["search"]}]}'></textarea>
                </div>
            </div>
            <div id="agent-workflow-metadata-modal" class="modal-overlay hidden agent-workflow-share-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="agent-workflow-metadata-title" style="z-index: 1935;">
                <div class="modal agent-workflow-create-modal agent-workflow-metadata-modal" role="document">
                    <div class="agent-workflow-share-head">
                        <div>
                            <h3 id="agent-workflow-metadata-title">编辑工作流</h3>
                            <p>修改工作流的基本信息，不会生成新的编排版本。</p>
                        </div>
                    </div>
                    <div class="agent-workflow-create-form">
                        <label class="agent-workflow-create-field" for="agent-workflow-metadata-name">
                            <span>工作流名称</span>
                            <input id="agent-workflow-metadata-name" class="form-input" type="text" maxlength="100" autocomplete="off" placeholder="请输入工作流名称">
                        </label>
                        <label class="agent-workflow-create-field" for="agent-workflow-metadata-description">
                            <span>工作流简介</span>
                            <textarea id="agent-workflow-metadata-description" class="form-input" rows="4" maxlength="300" placeholder="简要说明用途、适用范围或产出"></textarea>
                            <small>最多 300 个字符</small>
                        </label>
                        <div id="agent-workflow-metadata-error" class="agent-workflow-create-status" role="alert"></div>
                    </div>
                    <div class="agent-workflow-share-footer">
                        <button id="agent-workflow-metadata-cancel-btn" class="btn-secondary" type="button">取消</button>
                        <button id="agent-workflow-metadata-save-btn" class="btn-primary" type="button">保存</button>
                    </div>
                </div>
            </div>
            <div id="agent-workflow-share-modal" class="modal-overlay hidden agent-workflow-share-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="agent-workflow-share-title" style="z-index: 1940;">
                <div class="modal agent-workflow-share-modal" role="document">
                    <div class="agent-workflow-share-head">
                        <div>
                            <h3 id="agent-workflow-share-title">分享工作流</h3>
                            <p id="agent-workflow-share-subtitle">设置谁可以查看和运行已发布版本。</p>
                        </div>
                    </div>
                    <div class="agent-workflow-share-body">
                        <div class="agent-workflow-share-summary" id="agent-workflow-share-summary"></div>
                        <fieldset class="agent-workflow-share-scope-fieldset">
                            <legend>可见范围</legend>
                            <label class="agent-workflow-share-choice">
                                <input type="radio" name="agent-workflow-share-scope" value="personal">
                                <span><strong>仅自己</strong><small>其他用户看不到，也不能运行。</small></span>
                            </label>
                            <label class="agent-workflow-share-choice">
                                <input type="radio" name="agent-workflow-share-scope" value="shared">
                                <span><strong>共享</strong><small>共享用户只能查看和运行已发布版本，不能编辑工作流。</small></span>
                            </label>
                        </fieldset>
                        <div id="agent-workflow-share-form-content"></div>
                        <div id="agent-workflow-share-error" class="agent-workflow-share-error" role="alert" hidden></div>
                    </div>
                    <div class="agent-workflow-share-footer">
                        <button id="agent-workflow-share-cancel-btn" class="btn-secondary" type="button">取消</button>
                        <button id="agent-workflow-share-save-btn" class="btn-primary" type="button">保存共享设置</button>
                    </div>
                </div>
            </div>
            <div id="agent-workflow-dependency-modal" class="modal-overlay hidden agent-workflow-dependency-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="agent-workflow-dependency-title" style="z-index: 1950;">
                <div class="modal agent-workflow-dependency-modal" role="document">
                    <div class="agent-workflow-share-head">
                        <div>
                            <h3 id="agent-workflow-dependency-title">配置运行依赖</h3>
                            <p id="agent-workflow-dependency-subtitle">为当前账号选择可用的等价模型、工具和受控凭据。</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button id="agent-workflow-dependency-manage-creds-btn" class="btn-secondary" type="button" style="font-size: 0.72rem; padding: 3px 8px;">管理安全凭据</button>
                            <button id="agent-workflow-dependency-close-btn" class="btn-danger-outline" type="button" aria-label="关闭依赖配置" title="关闭依赖配置">关闭</button>
                        </div>
                    </div>
                    <div class="agent-workflow-dependency-body">
                        <div id="agent-workflow-dependency-summary" class="agent-workflow-dependency-summary"></div>
                        <div id="agent-workflow-dependency-list" class="agent-workflow-dependency-list"></div>
                        <div id="agent-workflow-dependency-error" class="agent-workflow-share-error" role="alert" hidden></div>
                    </div>
                    <div class="agent-workflow-share-footer">
                        <button id="agent-workflow-dependency-cancel-btn" class="btn-secondary" type="button">取消</button>
                        <button id="agent-workflow-dependency-save-btn" class="btn-primary" type="button">确认依赖映射</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
