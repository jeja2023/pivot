<!-- 应用中心 -->

                                    <option value="历史公文">历史公文</option>
                                    <option value="规范条文">规范条文</option>

                            </div>

                                <input id="official-writing-requirements" class="form-input" placeholder="语气、结构、字数、重点或限制">

                                    <button class="btn-secondary" type="button" data-official-writing-run-mode="rewrite_section">局改</button>

                                        <button id="official-writing-drawer-open-btn" class="btn-secondary official-writing-command-menu-item" type="button">审改中心</button>

                                        <button id="official-writing-reset-btn" class="btn-secondary official-writing-command-menu-item" type="button">清空</button>
                                    </div>
                                </details>
                            </div>
                        </div>

                        <div class="official-writing-workbench">

                                </div>
                                <div class="official-writing-material-tabs" role="tablist" aria-label="素材分类">
                                    <button class="official-writing-material-tab active" type="button" data-official-writing-material-tab="outline">大纲</button>
                                    <button class="official-writing-material-tab" type="button" data-official-writing-material-tab="materials">材料</button>

                                <div class="official-writing-rail-body">

                                        <div id="official-writing-outline-list" class="official-writing-outline-list"></div>
                                    </section>
                                    <section id="official-writing-materials-panel" class="official-writing-material-panel hidden">

                                            <p id="official-writing-material-preview">暂无材料</p>
                                        </div>

                                        <div id="official-writing-material-card-list" class="official-writing-material-card-list"></div>

                                    </section>
                                    <section id="official-writing-history-panel" class="official-writing-material-panel hidden">

                                    </section>
                                    <section id="official-writing-standards-panel" class="official-writing-material-panel hidden">

                                        <button class="official-writing-standard-item" type="button" data-official-writing-requirement="语言应准确、庄重、克制，避免口语化和绝对化表述。">公文语体稳健</button>
                                        <button class="official-writing-standard-item" type="button" data-official-writing-requirement="涉及单位、时间、数据、政策依据时不得编造，缺失信息用【待补充】标注。">事实依据可追溯</button>

                                    <section id="official-writing-templates-panel" class="official-writing-material-panel hidden">
                                        <button class="official-writing-template-item" type="button" data-official-writing-template="notice">通知框架</button>

                                        <button class="official-writing-template-item" type="button" data-official-writing-template="letter">函框架</button>
                                        <button class="official-writing-template-item" type="button" data-official-writing-template="minutes">会议纪要框架</button>
                                    </section>
                                </div>
                            </aside>

                            <div class="official-writing-shell">
                                <main class="official-writing-editor-area">
                                    <div class="official-writing-editor-toolbar">
                                        <div>
                                            <strong id="official-writing-editor-title">正文编辑</strong>

                                        </div>
                                        <div class="official-writing-editor-tools">
                                            <button id="official-writing-sync-btn" class="btn-secondary" type="button">同步原文</button>
                                            <button id="official-writing-source-selection-btn" class="btn-secondary" type="button">引用原文选区</button>
                                            <button id="official-writing-draft-selection-btn" class="btn-secondary" type="button">引用正文选区</button>
                                        </div>
                                    </div>
                                    <div id="official-writing-editor-grid" class="official-writing-editor-grid">
                                        <section class="official-writing-editor-pane official-writing-source-pane">
                                            <div class="official-writing-pane-head">

                                                    <h4>原文</h4>
                                                    <span id="official-writing-source-count">0 字</span>
                                                </div>

                                            <textarea id="official-writing-source" class="form-input official-writing-editor" placeholder="粘贴原文、材料或待处理段落。"></textarea>

                                                <button id="official-writing-add-comment-btn" class="btn-primary" type="button">添加批注</button>
                                            </div>
                                            <div id="official-writing-comments-list" class="official-writing-comments-list"></div>
                                        </section>
                                    </div>
                                    <div id="official-writing-versions-drawer" class="official-writing-drawer-section hidden">

                                            <div id="official-writing-diff-result" class="official-writing-diff-result">

                                        </section>
                                    </div>
                                </aside>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
