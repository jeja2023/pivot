<!-- 能力库工作台 -->
    <section id="mcp-workbench-modal" class="main-workspace-view mcp-workspace-view hidden">
        <div class="workspace-modal mcp-workspace-modal">
            <div class="workspace-modal-header">
                <div>
                    <h3>能力库</h3>
                    <p>把图表、报表、数据库、通知等能力交给聊天使用；先启用，再回到聊天点亮能力库。</p>
                </div>
                <button id="mcp-modal-close" class="btn-secondary workspace-modal-close">关闭</button>
            </div>
            <div class="workspace-modal-body">
                <div class="mcp-onboarding-panel">
                    <div>
                        <strong>三步用好能力库</strong>
                        <span>先启用系统能力，再按需连接数据库、报表或通知服务，回到聊天时点亮能力库按钮即可让模型调用。</span>
                    </div>
                    <div class="mcp-onboarding-steps">
                        <span>1 启用能力</span>
                        <span>2 确认可用动作</span>
                        <span>3 聊天中授权使用</span>
                    </div>
                </div>
                <div id="mcp-governance-panel" class="workspace-governance-panel"></div>
                <div class="mcp-layout">
                    <div class="mcp-list-wrap">
                        <div id="mcp-system-services" class="mcp-system-services"></div>
                        <div id="mcp-server-list" class="mcp-server-list"></div>
                        <div id="mcp-tool-cache" class="agent-tool-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 管理与配置面板 (符合第39条复用规范) -->
    <div id="mcp-edit-modal" class="modal-overlay hidden" style="z-index: 1900;">
        <div class="modal mcp-edit-modal">
            <div class="mcp-edit-header">
                <h3>编辑能力</h3>
            </div>
            <div class="mcp-edit-form">
                <input type="hidden" id="mcp-edit-id">
                <select id="mcp-edit-source-type" class="form-input" disabled>
                    <option value="external">外部能力服务（技术同事提供）</option>
                    <option value="database">数据库连接</option>
                    <option value="reports">报表文件</option>
                    <option value="visualization">图表生成</option>
                    <option value="report">报告编排</option>
                    <option value="im">IM 通知</option>
                </select>
                <input id="mcp-edit-name" class="form-input" placeholder="服务名称">
                <div id="mcp-edit-helper" class="mcp-config-helper" aria-live="polite"></div>
                <div id="mcp-edit-external-fields" class="mcp-field-group">
                    <input id="mcp-edit-url" class="form-input" placeholder="外部能力服务地址，由技术同事提供，例如 http://localhost:8787/mcp">
                    <input id="mcp-edit-key" class="form-input" type="password" placeholder="访问密钥，可选；没有就留空">
                </div>
                <div id="mcp-edit-db-fields" class="mcp-field-group hidden">
                    <div class="mcp-form-row">
                        <select id="mcp-edit-db-type" class="form-input">
                            <option value="postgres">PostgreSQL</option>
                            <option value="mysql">MySQL / MariaDB</option>
                            <option value="sqlserver">SQL Server</option>
                            <option value="sqlite">SQLite</option>
                            <option value="mongodb">MongoDB</option>
                        </select>
                        <input id="mcp-edit-db-port" class="form-input" type="number" placeholder="端口">
                    </div>
                    <input id="mcp-edit-db-host" class="form-input" placeholder="主机地址，例如 10.0.0.8">
                    <input id="mcp-edit-db-name" class="form-input" placeholder="数据库名；SQLite 填文件路径">
                    <div class="mcp-form-row">
                        <input id="mcp-edit-db-user" class="form-input" placeholder="用户名">
                        <input id="mcp-edit-db-password" class="form-input" type="password" placeholder="密码">
                    </div>
                    <div class="mcp-form-row">
                        <input id="mcp-edit-db-schema" class="form-input" placeholder="数据分组/Schema，可选；不确定就留空">
                        <input id="mcp-edit-db-max-rows" class="form-input" type="number" min="1" max="1000" placeholder="最大返回行数">
                    </div>
                    <label class="mcp-shared-row">
                        <input type="checkbox" id="mcp-edit-db-ssl"> 启用 SSL / TLS
                    </label>
                </div>
                <div id="mcp-edit-reports-fields" class="mcp-field-group hidden">
                    <textarea id="mcp-edit-reports-roots" class="form-input" placeholder="报表/数据文件目录，每行一个，例如 D:\reports 或 \\nas\share\reports"></textarea>
                    <div class="mcp-form-row">
                        <input id="mcp-edit-reports-extensions" class="form-input" placeholder="允许扩展名：csv,xlsx,xls,json,txt,md">
                        <input id="mcp-edit-reports-max-file-mb" class="form-input" type="number" min="1" max="200" placeholder="单文件 MB，默认 20">
                    </div>
                    <input id="mcp-edit-reports-max-rows" class="form-input" type="number" min="1" max="5000" placeholder="单次最大读取行数，默认 500">
                </div>
                <div id="mcp-edit-im-fields" class="mcp-field-group hidden">
                    <input id="mcp-edit-im-endpoint-url" class="form-input" placeholder="局域网聊天工具接收地址，由技术同事提供，例如 http://10.0.0.8:9000/api/message">
                    <div class="mcp-form-row">
                        <input id="mcp-edit-im-auth-header" class="form-input" placeholder="认证 Header，默认 Authorization">
                        <input id="mcp-edit-im-token" class="form-input" type="password" placeholder="Token / 密钥，可选">
                    </div>
                    <textarea id="mcp-edit-im-allowed-targets" class="form-input" placeholder="允许发送目标，每行一个；可写 user:zhangsan 或 group:ops"></textarea>
                    <div class="mcp-form-row">
                        <input id="mcp-edit-im-default-target" class="form-input" placeholder="默认目标，可选">
                        <input id="mcp-edit-im-max-message-length" class="form-input" type="number" min="100" max="10000" placeholder="消息最大长度，默认 2000">
                    </div>
                    <label class="mcp-shared-row">
                        <input type="checkbox" id="mcp-edit-im-allow-at-all"> 允许 @all / 全员通知
                    </label>
                </div>
                <textarea id="mcp-edit-desc" class="form-input" placeholder="说明，可选"></textarea>
                <label class="mcp-shared-row super-admin-only hidden">
                    <input type="checkbox" id="mcp-edit-shared"> 作为全局共享服务
                </label>
                <div class="mcp-edit-actions">
                    <button id="mcp-edit-test-db-btn" class="btn-secondary hidden" type="button">测试连接</button>
                    <button id="mcp-edit-save-btn" class="btn-primary" type="button">保存修改</button>
                    <button id="mcp-edit-cancel-btn" class="btn-secondary" type="button">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div id="mcp-tools-modal" class="modal-overlay hidden" style="z-index: 1910;">
        <div class="modal mcp-tools-modal">
            <div class="mcp-edit-header">
                <h3 id="mcp-tools-title">可用动作</h3>
                <div class="mcp-tools-header-actions">
                    <button id="mcp-tools-refresh-btn" class="btn-secondary" type="button">刷新动作</button>
                    <button id="mcp-tools-close-btn" class="btn-secondary" type="button">关闭</button>
                </div>
            </div>
            <div id="mcp-tools-list" class="mcp-tools-list"></div>
        </div>
    </div>
