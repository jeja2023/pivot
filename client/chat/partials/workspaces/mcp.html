<!-- MCP 工具工作台 -->
    <section id="mcp-workbench-modal" class="main-workspace-view mcp-workspace-view hidden">
        <div class="workspace-modal mcp-workspace-modal">
            <div class="workspace-modal-header">
                <div>
                    <h3>MCP 工具</h3>
                    <p>接入外部 MCP Server 或内置数据库 MCP 工具，刷新工具缓存，并供聊天与智能体任务调用。</p>
                </div>
                <button id="mcp-modal-close" class="btn-secondary workspace-modal-close">关闭</button>
            </div>
            <div class="workspace-modal-body">
                <div class="workspace-section-head">
                    <div>
                        <h3>工具源</h3>
                        <p>保存服务后可刷新工具列表，外部工具会进入智能体可用工具池。</p>
                    </div>
                    <button id="mcp-refresh-btn" class="btn-secondary">刷新</button>
                </div>
                <div id="mcp-governance-panel" class="workspace-governance-panel"></div>
                <div class="mcp-layout">
                    <div class="mcp-form">
                        <input type="hidden" id="mcp-id">
                        <select id="mcp-source-type" class="form-input">
                            <option value="reports">报表与数据文件 MCP</option>
                            <option value="visualization">可视化图表 MCP</option>
                            <option value="report">报告编排 MCP</option>
                            <option value="im">局域网消息通知 MCP</option>
                            <option value="external" selected>外部 MCP Server</option>
                            <option value="database">数据库 MCP Server</option>
                        </select>
                        <input id="mcp-name" class="form-input" placeholder="服务名称">
                        <div id="mcp-external-fields" class="mcp-field-group">
                            <input id="mcp-url" class="form-input" placeholder="MCP JSON-RPC URL，例如 http://localhost:8787/mcp">
                            <input id="mcp-key" class="form-input" type="password" placeholder="API Key，可选">
                        </div>
                        <div id="mcp-db-fields" class="mcp-field-group hidden">
                            <div class="mcp-form-row">
                                <select id="mcp-db-type" class="form-input">
                                    <option value="postgres">PostgreSQL</option>
                                    <option value="mysql">MySQL / MariaDB</option>
                                    <option value="sqlserver">SQL Server</option>
                                    <option value="sqlite">SQLite</option>
                                    <option value="mongodb">MongoDB</option>
                                </select>
                                <input id="mcp-db-port" class="form-input" type="number" placeholder="端口">
                            </div>
                            <input id="mcp-db-host" class="form-input" placeholder="主机地址，例如 10.0.0.8">
                            <input id="mcp-db-name" class="form-input" placeholder="数据库名；SQLite 填文件路径">
                            <div class="mcp-form-row">
                                <input id="mcp-db-user" class="form-input" placeholder="用户名">
                                <input id="mcp-db-password" class="form-input" type="password" placeholder="密码">
                            </div>
                            <div class="mcp-form-row">
                                <input id="mcp-db-schema" class="form-input" placeholder="Schema，可选">
                                <input id="mcp-db-max-rows" class="form-input" type="number" min="1" max="1000" placeholder="最大返回行数">
                            </div>
                            <label class="mcp-shared-row">
                                <input type="checkbox" id="mcp-db-ssl"> 启用 SSL / TLS
                            </label>
                        </div>
                        <div id="mcp-reports-fields" class="mcp-field-group hidden">
                            <textarea id="mcp-reports-roots" class="form-input" placeholder="报表/数据文件目录，每行一个，例如 D:\reports 或 \\nas\share\reports"></textarea>
                            <div class="mcp-form-row">
                                <input id="mcp-reports-extensions" class="form-input" placeholder="允许扩展名：csv,xlsx,xls,json,txt,md">
                                <input id="mcp-reports-max-file-mb" class="form-input" type="number" min="1" max="200" placeholder="单文件 MB，默认 20">
                            </div>
                            <input id="mcp-reports-max-rows" class="form-input" type="number" min="1" max="5000" placeholder="单次最大读取行数，默认 500">
                        </div>
                        <div id="mcp-im-fields" class="mcp-field-group hidden">
                            <input id="mcp-im-endpoint-url" class="form-input" placeholder="局域网聊天工具 Webhook/API URL，例如 http://10.0.0.8:9000/api/message">
                            <div class="mcp-form-row">
                                <input id="mcp-im-auth-header" class="form-input" placeholder="认证 Header，默认 Authorization">
                                <input id="mcp-im-token" class="form-input" type="password" placeholder="Token / 密钥，可选">
                            </div>
                            <textarea id="mcp-im-allowed-targets" class="form-input" placeholder="允许发送目标，每行一个；可写 user:zhangsan 或 group:ops"></textarea>
                            <div class="mcp-form-row">
                                <input id="mcp-im-default-target" class="form-input" placeholder="默认目标，可选">
                                <input id="mcp-im-max-message-length" class="form-input" type="number" min="100" max="10000" placeholder="消息最大长度，默认 2000">
                            </div>
                            <label class="mcp-shared-row">
                                <input type="checkbox" id="mcp-im-allow-at-all"> 允许 @all / 全员通知
                            </label>
                        </div>
                        <textarea id="mcp-desc" class="form-input" placeholder="说明，可选"></textarea>
                        <label class="mcp-shared-row super-admin-only hidden">
                            <input type="checkbox" id="mcp-shared"> 作为全局共享服务
                        </label>
                        <div class="agent-run-controls">
                            <button id="mcp-test-db-btn" class="btn-secondary hidden" type="button">测试连接</button>
                            <button id="mcp-save-btn" class="btn-primary">保存服务</button>
                            <button id="mcp-reset-btn" class="btn-secondary">清空</button>
                        </div>
                    </div>
                    <div class="mcp-list-wrap">
                        <div id="mcp-server-list" class="mcp-server-list"></div>
                        <div id="mcp-tool-cache" class="agent-tool-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
