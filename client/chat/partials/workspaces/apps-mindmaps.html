<div id="mindmaps-view" class="mindmaps-view hidden">
    <div id="mindmap-library" class="workspace-panel mm-library-panel">
        <div class="workspace-toolbar mindmap-toolbar mindmap-lib-toolbar">
            <div class="mm-lib-primary-actions">
                <button type="button" class="btn-primary mm-new-btn" data-mm-action="new"><svg class="mm-icon" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>新建导图</span></button>
                <button type="button" class="btn-secondary mm-lib-btn mm-ai-btn" data-mm-action="ai"><svg class="mm-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><span>AI 生成</span></button>
                <div class="mm-dropdown" id="mindmap-more-dropdown">
                    <button type="button" class="btn-secondary mm-dropdown-toggle" id="mindmap-more-btn" aria-haspopup="true" aria-expanded="false" title="更多创建与导入选项">
                        <span>更多操作</span>
                        <svg class="mm-icon-chevron" aria-hidden="true" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="mm-dropdown-menu hidden" id="mindmap-more-menu" role="menu">
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="import" role="menuitem"><svg class="mm-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>导入导图文件 (XMind/MD/JSON)</span></button>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="data-import" role="menuitem"><svg class="mm-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg><span>数据转导图</span></button>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="dataset-mapping" role="menuitem"><svg class="mm-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><span>数据层级映射</span></button>
                        <div class="mm-dropdown-divider" role="separator"></div>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="personal-templates" role="menuitem"><svg class="mm-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span>个人模板管理</span></button>
                    </div>
                </div>
            </div>
            <div class="mm-lib-filter-actions">
                <div class="mm-filter-bar" role="search" aria-label="导图筛选与搜索">
                    <div class="mm-scope-wrap">
                        <select id="mindmap-library-scope" class="form-input mm-scope-select" title="按归属范围筛选">
                            <option value="all">全部导图</option>
                            <option value="owned">我创建的</option>
                            <option value="shared">共享给我</option>
                            <option value="trash">回收站</option>
                        </select>
                        <svg class="mm-scope-arrow" aria-hidden="true" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    <div class="mm-filter-divider" aria-hidden="true"></div>
                    <div class="mm-search-box">
                        <svg class="mm-search-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input id="mindmap-search" type="search" class="form-input mm-search-input" maxlength="120" placeholder="搜索导图标题…">
                    </div>
                    <div class="mm-filter-divider" aria-hidden="true"></div>
                    <div class="mm-tag-box">
                        <svg class="mm-tag-icon" aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                        <input id="mindmap-tag-filter" class="form-input mm-tag-input" maxlength="32" placeholder="按标签筛选…">
                    </div>
                    <div class="mm-filter-divider" aria-hidden="true"></div>
                    <label class="mm-fav-toggle" for="mindmap-favorites-only" title="仅查看已加星标的导图">
                        <input id="mindmap-favorites-only" type="checkbox">
                        <svg class="mm-fav-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <span class="mm-fav-text">只看收藏</span>
                    </label>
                </div>
                <button type="button" class="btn-secondary mm-lib-btn mm-refresh-btn" data-mm-action="refresh" title="刷新导图列表"><svg class="mm-icon" aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span>刷新</span></button>
            </div>
        </div>
        <p id="mindmap-library-status" role="status" aria-live="polite" class="sr-only"></p>
        <div class="table-container workspace-table-wrap mm-table-wrap">
            <table class="data-table compact-table mm-data-table">
                <thead>
                    <tr>
                        <th class="text-center mm-th-idx">序号</th>
                        <th class="mm-th-title">名称</th>
                        <th class="text-center mm-th-source">来源</th>
                        <th class="text-center mm-th-version">版本</th>
                        <th class="text-center mm-th-time">更新时间</th>
                        <th class="text-center mm-th-actions">操作</th>
                    </tr>
                </thead>
                <tbody id="mindmap-documents"></tbody>
            </table>
        </div>
        <div id="mindmap-pagination" class="pagination workspace-pagination mindmap-pagination"></div>
    </div>
    <div id="mindmap-editor" class="mindmap-editor hidden">
        <!-- 1. XMind 风格顶部主操作栏 (XMind Header Bar) -->
        <header class="xmind-top-bar">
            <!-- 左侧：返回导图库、标题、状态徽章、思维导图/大纲切换 -->
            <div class="xmind-bar-left">
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost xmind-back-btn" data-mm-action="library" title="返回导图列表" aria-label="文档列表">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    <span>导图列表</span>
                </button>
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost" data-mm-action="refresh-source" id="mindmap-source-refresh" aria-label="刷新来源数据" title="刷新来源数据映射" hidden>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    <span>刷新来源数据</span>
                </button>
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost xmind-panel-toggle is-active" id="xmind-toggle-outline" title="展开/收起节点大纲">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                    <span>大纲</span>
                </button>
                <div class="xmind-toolbar-divider"></div>
                <div class="xmind-title-wrap">
                    <span id="mindmap-doc-title" class="xmind-doc-title" title="当前思维导图">思维导图</span>
                    <span id="mindmap-save-status" class="xmind-badge xmind-save-badge" role="status" aria-live="polite">已保存</span>
                    <span id="mindmap-access-status" class="xmind-badge xmind-access-badge" role="status">个人文档</span>
                </div>
            </div>

            <!-- 中间：XMind 经典中心浮动/固定工具栏 -->
            <div class="xmind-bar-center">
                <div class="xmind-toolbar-group">
                    <button type="button" class="btn-secondary xmind-tool-btn" data-mm-command="INSERT_CHILD_NODE" title="添加子主题 (Tab)" aria-label="子节点">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="7" height="6" rx="1.5"/><rect x="14" y="4" width="7" height="5" rx="1.2"/><rect x="14" y="15" width="7" height="5" rx="1.2"/><path d="M10 12h2a2 2 0 0 0 2-2V6.5M12 12a2 2 0 0 1 2 2v3.5"/></svg>
                        <span>子主题</span>
                    </button>
                    <button type="button" class="btn-secondary xmind-tool-btn" data-mm-command="INSERT_NODE" title="添加同级主题 (Enter)">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="7" height="5" rx="1.2"/><rect x="3" y="14" width="7" height="5" rx="1.2"/><line x1="6.5" y1="10" x2="6.5" y2="14"/><polyline points="4.5 12 6.5 14 8.5 12"/><circle cx="17" cy="12" r="3"/><line x1="10" y1="7.5" x2="14" y2="12"/></svg>
                        <span>同级主题</span>
                    </button>
                    <button type="button" class="btn-secondary xmind-tool-btn" data-mm-action="relations" title="添加或管理联系关联线" aria-label="关联线">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="18" r="3"/><circle cx="19" cy="6" r="3"/><path d="M8 17c4 0 6-6 10-9"/><polyline points="15 6 19 6 19 10"/></svg>
                        <span>联系</span>
                    </button>
                    <button type="button" class="btn-secondary xmind-tool-btn" data-mm-action="summaries" title="添加或管理概要">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v6a3 3 0 0 1-3 3 3 3 0 0 1 3 3v6"/><path d="M12 12h9"/></svg>
                        <span>概要</span>
                    </button>
                    <button type="button" class="btn-danger xmind-tool-btn is-danger" data-mm-command="REMOVE_NODE" title="删除分支 (Delete)">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        <span>删除</span>
                    </button>
                </div>

                <div class="xmind-toolbar-divider"></div>

                <div class="xmind-toolbar-group">
                    <button type="button" class="btn-secondary xmind-tool-btn xmind-icon-only" data-mm-command="BACK" title="撤销 (Ctrl+Z)" aria-label="撤销">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                    </button>
                    <button type="button" class="btn-secondary xmind-tool-btn xmind-icon-only" data-mm-command="FORWARD" title="重做 (Ctrl+Y)" aria-label="重做">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
                    </button>
                </div>

                <div class="xmind-toolbar-divider"></div>

                <div class="xmind-toolbar-group">
                    <button type="button" class="btn-secondary xmind-tool-btn xmind-icon-only" data-mm-action="fold" title="一键折叠分支">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    </button>
                    <button type="button" class="btn-secondary xmind-tool-btn xmind-icon-only" data-mm-action="unfold" title="一键展开分支">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    </button>
                </div>
            </div>

            <!-- 右侧：演说、协作、历史、导出下拉、保存、格式面板开关 -->
            <div class="xmind-bar-right">
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost" data-mm-action="present" title="全屏演示" aria-label="演示">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span>演说</span>
                </button>
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost" data-mm-action="sharing" title="管理共享协作权限" aria-label="共享协作">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span>协作</span>
                </button>
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost" data-mm-action="versions" title="查看历史版本快照" aria-label="历史版本">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>历史</span>
                </button>
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost" data-mm-action="template-save" title="将当前导图保存为个人复用模板" aria-label="保存为模板">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>保存为模板</span>
                </button>

                <!-- 导出格式下拉按钮 -->
                <div class="mm-dropdown xmind-export-dropdown" id="xmind-export-dropdown">
                    <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost xmind-export-btn" id="xmind-export-btn" data-mm-action="export-menu" aria-haspopup="true" aria-expanded="false" title="导出思维导图">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <span>导出</span>
                    </button>
                    <div class="mm-dropdown-menu xmind-export-menu hidden" id="xmind-export-menu" role="menu">
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="json" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            <span>原生 JSON (*.json)</span>
                        </button>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="xmind" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
                            <span>XMind 格式文件 (*.xmind)</span>
                        </button>
                        <div class="mm-dropdown-divider" role="separator"></div>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="png" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <span>PNG 高清图片 (*.png)</span>
                        </button>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="svg" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                            <span>SVG 矢量图 (*.svg)</span>
                        </button>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="pdf" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            <span>PDF 打印文档 (*.pdf)</span>
                        </button>
                        <div class="mm-dropdown-divider" role="separator"></div>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="md" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                            <span>Markdown 结构大纲 (*.md)</span>
                        </button>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="opml" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                            <span>OPML 大纲文件 (*.opml)</span>
                        </button>
                        <button type="button" class="btn-secondary mm-dropdown-item" data-mm-action="export-format" data-format="mm" role="menuitem">
                            <svg class="mm-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                            <span>FreeMind 文件 (*.mm)</span>
                        </button>
                    </div>
                    <select id="mindmap-export-format" class="form-input sr-only" aria-hidden="true" tabindex="-1">
                        <option value="json" selected>原生 JSON</option>
                        <option value="xmind">XMind 格式文件 (*.xmind)</option>
                        <option value="svg">SVG 矢量图</option>
                        <option value="png">PNG 高清图片</option>
                        <option value="pdf">PDF 打印文档</option>
                        <option value="md">Markdown 结构大纲</option>
                        <option value="opml">OPML 大纲</option>
                        <option value="mm">FreeMind 文件</option>
                    </select>
                </div>

                <!-- 保存按钮 -->
                <button type="button" class="btn-primary xmind-save-btn" data-mm-action="save" title="保存导图修改 (Ctrl+S)">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    <span>保存</span>
                </button>

                <!-- 格式面板开关按钮 (像 XMind 右上角面板切换一样) -->
                <button type="button" class="btn-secondary xmind-btn xmind-btn-ghost xmind-panel-toggle is-active" id="xmind-toggle-inspector" title="展开/收起格式面板">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                    <span>格式</span>
                </button>
            </div>
        </header>

        <!-- 冲突提示条 -->
        <div id="mindmap-conflict" class="mindmap-notice hidden" role="alert">
            <span>服务端已有新版本，本地修改已保留。</span>
            <button type="button" class="btn-secondary" data-mm-action="reload">重载服务端版本</button>
            <button type="button" class="btn-secondary" data-mm-action="copy">另存本地副本</button>
        </div>

        <!-- 2. 工作台主体 (三栏：大纲侧边栏 + 画布容器 + XMind 格式检查器) -->
        <div class="mindmap-workbench" id="xmind-workbench">
            <!-- 左侧：大纲侧边栏 (点击顶部 [大纲] 展开或收起) -->
            <aside class="mindmap-outline" id="xmind-outline-panel">
                <div class="xmind-outline-header">
                    <div class="xmind-outline-title">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                        <strong>节点大纲</strong>
                    </div>
                </div>
                <div id="mindmap-outline" class="xmind-outline-tree" role="tree" aria-label="导图节点"></div>
            </aside>

            <!-- 中间：画布及浮动底部状态栏 -->
            <div class="xmind-canvas-container">
                <div id="mindmap-canvas" class="mindmap-canvas" tabindex="0" aria-label="思维导图画布，双击编辑，Tab 添加子节点，Enter 添加同级"></div>

                <!-- XMind 风格底部悬浮状态栏 (画布标签、节点统计、缩放、适配) -->
                <footer class="xmind-canvas-footer">
                    <div class="xmind-footer-left">
                        <span class="xmind-sheet-tag">画布 1</span>
                    </div>

                    <div class="xmind-footer-right">
                        <span class="xmind-node-stat" id="xmind-topic-stat">主题: -</span>
                        <button type="button" class="xmind-footer-btn" data-mm-action="minimap" title="显示或隐藏导图导航缩略图">
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
                            <span>导航图</span>
                        </button>
                        <div class="xmind-zoom-controls">
                            <button type="button" class="xmind-zoom-btn" id="xmind-zoom-out" title="缩小画布">
                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                            <span class="xmind-zoom-val" id="xmind-zoom-percent">100%</span>
                            <button type="button" class="xmind-zoom-btn" id="xmind-zoom-in" title="放大画布">
                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                            <button type="button" class="xmind-zoom-btn xmind-fit-btn" data-mm-action="fit" title="适配居中到视口">
                                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                            </button>
                        </div>
                    </div>
                </footer>
            </div>

            <!-- 右侧：XMind 格式检查器 (样式 / 画布 双标签设计，完全对标 Image 2) -->
            <aside class="mindmap-properties xmind-inspector" id="xmind-inspector">
                <!-- 顶部 Segmented Control 切换 [ 样式 ] [ 画布 ] -->
                <div class="xmind-inspector-tabs" role="tablist">
                    <button type="button" class="xmind-tab-btn is-active" id="xmind-prop-tab-style" role="tab" aria-selected="true">
                        <span>样式</span>
                    </button>
                    <button type="button" class="xmind-tab-btn" id="xmind-prop-tab-canvas" role="tab" aria-selected="false">
                        <span>画布</span>
                    </button>
                </div>

                <!-- TAB 1: 样式 (Style Tab) -->
                <div class="xmind-tab-pane" id="xmind-pane-style">
                    <!-- 节点选中状态指示 -->
                    <div class="xmind-selection-bar">
                        <span class="xmind-selection-dot"></span>
                        <span id="mindmap-selection" class="xmind-selection-text">请在画布中选择节点</span>
                    </div>

                    <!-- 1. 结构 (Structure) -->
                    <div class="xmind-prop-section">
                        <div class="xmind-prop-row">
                            <span class="xmind-prop-label">结构</span>
                            <div class="xmind-prop-ctrl">
                                <select id="mindmap-layout" class="form-input xmind-select"></select>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 形状 (Shape) -->
                    <div class="xmind-prop-section">
                        <div class="xmind-prop-row">
                            <span class="xmind-prop-label">形状</span>
                            <div class="xmind-prop-ctrl">
                                <select id="mindmap-node-shape" class="form-input xmind-select">
                                    <option value="roundedRectangle">圆角矩形</option>
                                    <option value="rectangle">直角矩形</option>
                                    <option value="ellipse">椭圆气泡</option>
                                    <option value="diamond">菱形决策</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 填充与边框 (Fill & Border) -->
                    <div class="xmind-prop-section">
                        <!-- 填充 -->
                        <div class="xmind-prop-row">
                            <label class="xmind-checkbox-label">
                                <input type="checkbox" id="mindmap-fill-check" checked>
                                <span>填充</span>
                            </label>
                            <div class="xmind-color-swatch-wrap">
                                <input type="color" id="mindmap-node-fill" class="xmind-color-input" title="填充颜色">
                            </div>
                        </div>

                        <!-- 边框 -->
                        <div class="xmind-prop-row">
                            <label class="xmind-checkbox-label">
                                <input type="checkbox" id="mindmap-border-check">
                                <span>边框</span>
                            </label>
                            <div class="xmind-border-ctrls">
                                <select id="mindmap-node-dash" class="form-input xmind-dash-select" title="线型">
                                    <option value="none">实线</option>
                                    <option value="5,5">虚线</option>
                                    <option value="2,2">点线</option>
                                </select>
                                <input type="number" id="mindmap-node-border-width" min="0" max="4" class="form-input xmind-num-input" title="边框宽度">
                                <div class="xmind-color-swatch-wrap">
                                    <input type="color" id="mindmap-node-border" class="xmind-color-input" title="边框颜色">
                                </div>
                            </div>
                        </div>

                        <!-- 内边距 -->
                        <div class="xmind-prop-subrow">
                            <span class="xmind-sublabel">边距 (X/Y)</span>
                            <div class="xmind-inline-inputs">
                                <input type="number" id="mindmap-node-padding-x" min="0" max="60" class="form-input xmind-num-input" placeholder="X" title="水平内边距">
                                <span class="xmind-dim">×</span>
                                <input type="number" id="mindmap-node-padding-y" min="0" max="60" class="form-input xmind-num-input" placeholder="Y" title="垂直内边距">
                            </div>
                        </div>
                    </div>

                    <!-- 4. 文本 (Text) -->
                    <div class="xmind-prop-section">
                        <div class="xmind-prop-row">
                            <span class="xmind-prop-label">文本</span>
                            <div class="xmind-prop-ctrl">
                                <select id="mindmap-node-font" class="form-input xmind-select">
                                    <option value="sans-serif">系统无衬线 (默认)</option>
                                    <option value="Microsoft YaHei">微软雅黑</option>
                                    <option value="Noto Sans SC">思源黑体</option>
                                    <option value="SimSun">宋体</option>
                                    <option value="Arial">Arial (西文)</option>
                                    <option value="monospace">等宽代码</option>
                                    <option value="serif">系统衬线</option>
                                </select>
                            </div>
                        </div>

                        <!-- 字号 -->
                        <div class="xmind-prop-row">
                            <div class="xmind-prop-ctrl xmind-w-full">
                                <select id="mindmap-node-size" class="form-input xmind-select">
                                    <option value="12">12 像素</option>
                                    <option value="14">14 像素</option>
                                    <option value="16">16 像素</option>
                                    <option value="18">18 像素</option>
                                    <option value="24">24 像素</option>
                                    <option value="32">32 像素</option>
                                </select>
                            </div>
                        </div>

                        <!-- 样式按钮行 (加粗、斜体、删除线、颜色、对齐) -->
                        <div class="xmind-format-buttons-row">
                            <div class="xmind-btn-group">
                                <button type="button" class="xmind-fmt-btn" id="xmind-btn-bold" title="加粗">
                                    <strong>B</strong>
                                </button>
                                <button type="button" class="xmind-fmt-btn" id="xmind-btn-italic" title="斜体">
                                    <em>I</em>
                                </button>
                                <button type="button" class="xmind-fmt-btn" id="xmind-btn-strike" title="文字装饰 (删除线/下划线)">
                                    <s>S</s>
                                </button>
                            </div>

                            <select id="mindmap-node-decoration" class="hidden">
                                <option value="none">无</option>
                                <option value="underline">下划线</option>
                                <option value="line-through">删除线</option>
                            </select>

                            <!-- 文字颜色 -->
                            <div class="xmind-color-swatch-wrap" title="文字颜色">
                                <input type="color" id="mindmap-node-color" class="xmind-color-input">
                            </div>

                            <!-- 对齐方式按钮组 -->
                            <div class="xmind-btn-group">
                                <button type="button" class="btn-secondary xmind-align-btn" data-align="left" title="左对齐">
                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
                                </button>
                                <button type="button" class="btn-secondary xmind-align-btn is-active" data-align="center" title="居中对齐">
                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                                </button>
                                <button type="button" class="btn-secondary xmind-align-btn" data-align="right" title="右对齐">
                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
                            </div>
                            <select id="mindmap-node-align" class="hidden">
                                <option value="left">左对齐</option>
                                <option value="center" selected>居中</option>
                                <option value="right">右对齐</option>
                            </select>
                        </div>

                        <div class="xmind-prop-subrow xmind-prop-subrow-gap">
                            <label class="xmind-checkbox-label">
                                <input type="checkbox" id="mindmap-node-bold">
                                <span>加粗</span>
                            </label>
                            <label class="xmind-checkbox-label">
                                <input type="checkbox" id="mindmap-node-italic">
                                <span>斜体</span>
                            </label>
                        </div>

                        <!-- 节点文字直接编辑 -->
                        <div class="xmind-prop-text-wrap">
                            <label class="xmind-sublabel" for="mindmap-node-text">节点文字</label>
                            <input id="mindmap-node-text" class="form-input xmind-input" maxlength="120" placeholder="节点文本内容">
                        </div>
                    </div>

                    <!-- 5. 分支线条 (Branch) -->
                    <div class="xmind-prop-section">
                        <div class="xmind-prop-row">
                            <span class="xmind-prop-label">分支连线</span>
                            <div class="xmind-line-ctrls">
                                <input type="number" id="mindmap-node-line-width" min="0" max="8" class="form-input xmind-num-input" title="线条粗细">
                                <div class="xmind-color-swatch-wrap" title="线条颜色">
                                    <input type="color" id="mindmap-node-line" class="xmind-color-input">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 6. 附加属性 (备注、超链接、AI操作) -->
                    <div class="xmind-prop-section">
                        <details class="xmind-details" open>
                            <summary class="xmind-details-summary">
                                <span>备注与超链接</span>
                                <svg class="xmind-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                            </summary>
                            <div class="xmind-details-content">
                                <label class="xmind-sublabel" for="mindmap-node-note">节点备注</label>
                                <textarea id="mindmap-node-note" class="form-input xmind-textarea" rows="3" maxlength="2000" placeholder="纯文本说明…"></textarea>
                                <label class="xmind-sublabel" for="mindmap-node-link">超链接</label>
                                <input id="mindmap-node-link" type="url" class="form-input xmind-input" maxlength="2048" placeholder="https://…">
                            </div>
                        </details>

                        <div class="xmind-node-actions">
                            <button type="button" class="btn-primary xmind-apply-btn" data-mm-action="apply-node" aria-label="应用到节点">应用到节点</button>
                            <div class="xmind-ai-actions">
                                <button type="button" class="btn-secondary xmind-ai-btn" data-mm-action="ai-expand" title="智能生成子分支" aria-label="AI 展开分支">
                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                                    <span>AI 扩展分支</span>
                                </button>
                                <button type="button" class="btn-secondary xmind-ai-btn" data-mm-action="ai-summarize" title="提炼归纳此分支" aria-label="AI 总结分支">
                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
                                    <span>AI 总结</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: 画布 (Canvas Tab) -->
                <div class="xmind-tab-pane hidden" id="xmind-pane-canvas">
                    <div class="xmind-prop-section">
                        <div class="xmind-prop-title">主题配色</div>
                        <div class="xmind-prop-row">
                            <select id="mindmap-theme" class="form-input xmind-select"></select>
                        </div>
                        <div class="xmind-theme-actions">
                            <button type="button" class="btn-secondary xmind-theme-btn" data-mm-action="theme-library">个人主题库</button>
                            <button type="button" class="btn-secondary xmind-theme-btn" data-mm-action="theme-pack">自定义主题包</button>
                        </div>
                    </div>

                    <div class="xmind-prop-section">
                        <div class="xmind-prop-title">保存偏好与模板</div>
                        <div class="xmind-toggles">
                            <label class="xmind-checkbox-label">
                                <input id="mindmap-auto-save" type="checkbox" checked>
                                <span>自动保存修改</span>
                            </label>
                            <label class="xmind-checkbox-label">
                                <input id="mindmap-local-drafts" type="checkbox" checked>
                                <span>保留本地实时草稿</span>
                            </label>
                        </div>
                        <div class="xmind-theme-actions">
                            <button type="button" class="btn-secondary xmind-theme-btn" data-mm-action="template-save" aria-label="设为模板">设为模板</button>
                            <button type="button" class="btn-secondary xmind-theme-btn" data-mm-action="copy">另存副本</button>
                        </div>
                        <button type="button" class="btn-secondary xmind-refresh-source-btn" data-mm-action="refresh-source" id="mindmap-source-refresh-side" title="刷新来源数据映射" hidden>刷新来源数据映射</button>
                    </div>

                    <div class="xmind-prop-section">
                        <div class="xmind-prop-title">导图规格指标</div>
                        <ul class="xmind-specs-list">
                            <li>节点上限：最多 5000 个节点</li>
                            <li>树形深度：最大 12 层级</li>
                            <li>单节点字数：上限 120 字符</li>
                            <li>导出高清：矢量 SVG / 4000px 渲染</li>
                        </ul>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 底部状态与浮层 -->
        <div id="mindmap-export-status" class="xmind-export-status-toast" role="status" aria-live="polite"></div>
        <div id="mindmap-minimap" class="mindmap-minimap hidden" aria-label="导图导航"></div>
        <div id="mindmap-present-controls" class="mindmap-present-controls hidden">
            <button type="button" class="btn-secondary" data-mm-action="present-prev">上一节点</button>
            <span id="mindmap-present-position" role="status"></span>
            <button type="button" class="btn-secondary" data-mm-action="present-next">下一节点</button>
            <button type="button" class="btn-secondary" data-mm-action="present-close">退出演示</button>
        </div>
    </div>
    <input id="mindmap-import-file" type="file" accept=".json,.md,.markdown,.opml,.mm,.xmind" class="hidden">
    <div id="mindmap-dialog" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="mindmap-dialog-title"><div class="workspace-modal mindmap-dialog"><div class="workspace-modal-header"><h3 id="mindmap-dialog-title"></h3><button type="button" class="btn-secondary workspace-modal-close" data-mm-action="dialog-close" aria-label="关闭">关闭</button></div><div id="mindmap-dialog-body" class="workspace-modal-body"></div></div></div>
</div>
