    <!-- 公告编辑弹窗 -->
    <div id="announcement-modal" class="modal-overlay hidden" style="z-index: 5400;">
        <div class="modal announcement-modal-panel">
            <div class="announcement-modal-head">
                <div>
                    <h3 id="announcement-modal-title">新建公告</h3>
                    <p>配置公告内容、投放范围和确认要求。</p>
                </div>
                <button id="announcement-modal-close" class="btn-secondary settings-dialog-close" type="button">关闭</button>
            </div>
            <form id="announcement-form" class="announcement-editor">
                <input id="announcement-id" type="hidden">
                <div class="form-item announcement-title-field">
                    <label for="announcement-title">标题</label>
                    <input id="announcement-title" class="form-input" type="text" maxlength="120" placeholder="例如：知识库索引维护通知">
                </div>
                <div class="form-item announcement-content-field">
                    <label for="announcement-content">内容</label>
                    <textarea id="announcement-content" class="form-input" rows="6" maxlength="12000" placeholder="填写用户需要看到的公告内容"></textarea>
                </div>
                <div class="form-item">
                    <label for="announcement-type">类型</label>
                    <select id="announcement-type" class="form-input">
                        <option value="system">系统通知</option>
                        <option value="security">安全提醒</option>
                        <option value="knowledge">知识库更新</option>
                        <option value="normal">普通公告</option>
                    </select>
                </div>
                <div class="form-item">
                    <label for="announcement-priority">优先级</label>
                    <select id="announcement-priority" class="form-input">
                        <option value="normal">普通</option>
                        <option value="high">重要</option>
                        <option value="critical">紧急</option>
                        <option value="low">低</option>
                    </select>
                </div>
                <div class="form-item">
                    <label for="announcement-target-type">投放范围</label>
                    <select id="announcement-target-type" class="form-input">
                        <option value="all">全员</option>
                        <option value="unit">按单位</option>
                        <option value="role">按角色</option>
                        <option value="users">指定用户</option>
                    </select>
                </div>
                <div class="form-item">
                    <label for="announcement-target-value">范围值</label>
                    <input id="announcement-target-value" class="form-input" type="text" placeholder="多个值用逗号分隔">
                </div>
                <div class="form-item">
                    <label for="announcement-starts-at">开始时间</label>
                    <input id="announcement-starts-at" class="form-input" type="datetime-local">
                </div>
                <div class="form-item">
                    <label for="announcement-ends-at">结束时间</label>
                    <input id="announcement-ends-at" class="form-input" type="datetime-local">
                </div>
                <div class="form-item">
                    <label for="announcement-status">状态</label>
                    <select id="announcement-status" class="form-input">
                        <option value="draft">草稿</option>
                        <option value="published">发布</option>
                        <option value="archived">归档</option>
                    </select>
                </div>
                <label class="announcement-ack-row">
                    <input id="announcement-require-ack" type="checkbox">
                    <span>要求用户确认后继续使用</span>
                </label>
                <label class="announcement-login-row">
                    <input id="announcement-show-login" type="checkbox">
                    <span>登录页展示</span>
                </label>
                <div class="announcement-editor-actions announcement-full-row">
                    <button id="announcement-save-btn" class="btn-primary" type="submit">保存公告</button>
                    <button id="announcement-reset-btn" class="btn-secondary" type="button">清空</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 公告详情弹窗 -->
    <div id="announcement-detail-modal" class="modal-overlay hidden" style="z-index: 5450;">
        <div class="modal announcement-modal-panel announcement-detail-panel">
            <div class="announcement-modal-head">
                <div>
                    <h3 id="announcement-detail-title">公告详情</h3>
                    <p id="announcement-detail-summary">查看公告内容、投放范围和确认情况。</p>
                </div>
                <button id="announcement-detail-close" class="btn-secondary settings-dialog-close" type="button">关闭</button>
            </div>
            <div class="announcement-detail-body">
                <div id="announcement-detail-meta" class="announcement-detail-meta"></div>
                <div class="announcement-detail-content">
                    <h4>公告内容</h4>
                    <div id="announcement-detail-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 知识库高级设置弹窗 -->
    <div id="rag-embedding-modal" class="modal-overlay hidden" style="z-index: 5500;">
        <div class="modal model-modal">
            <div class="model-modal-header">
                <h3>知识库高级设置</h3>
                <p class="model-modal-desc">普通用户保持默认即可；只有需要调整资料匹配要求或更换资料理解模型时再修改。</p>
            </div>
            <div class="model-form">
                <div class="model-form-row">
                    <div class="form-item">
                        <label>匹配要求</label>
                        <input type="number" id="setting-rag-score-threshold" class="form-input" min="0" max="1" step="0.05" placeholder="推荐 0.4">
                    </div>
                    <div class="form-item">
                        <label>返回答案数</label>
                        <input type="number" id="setting-rag-top-k" class="form-input" min="1" max="10" step="1" placeholder="推荐 3">
                    </div>
                </div>
                <div class="form-item">
                    <label>查找范围</label>
                    <input type="number" id="setting-rag-candidate-limit" class="form-input" min="20" max="1000" step="10" placeholder="推荐 300">
                </div>
                <div class="model-form-row">
                    <div class="form-item">
                        <label>单段资料长度</label>
                        <input type="number" id="setting-rag-chunk-size" class="form-input" min="200" max="2000" step="50" placeholder="推荐 500">
                    </div>
                    <div class="form-item">
                        <label>相邻资料重复字数</label>
                        <input type="number" id="setting-rag-chunk-overlap" class="form-input" min="0" max="1000" step="25" placeholder="推荐 100">
                    </div>
                </div>
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 5px 0;">
                <input type="hidden" id="setting-rag-embedding-mode" value="http">
                <div class="form-item">
                    <label>资料理解服务地址</label>
                    <input type="text" id="setting-rag-embedding-url" class="form-input" placeholder="由技术同事提供，例如 https://api.example.com/v1 或 http://127.0.0.1:11434/api/embed">
                </div>
                <div class="form-item">
                    <label>访问密钥</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="setting-rag-embedding-key" class="form-input" placeholder="输入访问密钥；留空会保留原配置" style="padding-right: 40px;">
                        <button type="button" id="rag-embedding-key-toggle" class="btn-icon" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-item">
                    <label>资料理解模型名称</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="setting-rag-embedding-model" class="form-input" placeholder="例如：bge-m3" style="flex: 1;">
                        <button type="button" id="rag-embedding-fetch-models-btn" class="btn-secondary" title="从 API 获取模型列表" style="padding: 0 12px; height: 38px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="setting-rag-embedding-model-select-container" class="hidden" style="margin-top: 8px;">
                        <select id="setting-rag-embedding-model-select" class="form-input" style="font-size: 0.85rem; height: 32px; padding: 4px 10px;"></select>
                    </div>
                </div>
                <p id="setting-rag-embedding-status" class="model-modal-desc" style="margin: 0;"></p>
                <div class="model-modal-actions">
                    <button id="rag-embedding-modal-cancel" class="btn-secondary">取消</button>
                    <button id="rag-embedding-test-btn" class="btn-secondary">测试连接</button>
                    <button id="rag-embedding-save-btn" class="btn-primary">保存高级设置</button>
                </div>
            </div>
        </div>
    </div>

    <div id="monitor-routes-modal" class="modal-overlay hidden" style="z-index: 5200;">
        <div class="modal" style="width: 1000px; padding: 25px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
                <h3 style="margin: 0;">热点接口详情 (最近 10 分钟)</h3>
                <button type="button" class="btn-danger-outline" data-static-action="close-monitor-routes">关闭</button>
            </div>
            <div class="table-container" style="max-height: 600px; border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 8px;">
                <table class="data-table compact-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;" class="text-center">序号</th>
                            <th style="width: 150px;">接口名称</th>
                            <th style="width: 80px;">方法</th>
                            <th>路由地址</th>
                            <th style="width: 80px;" class="text-center">状态</th>
                            <th style="width: 100px;">请求数</th>
                            <th style="width: 120px;">平均延迟</th>
                        </tr>
                    </thead>
                    <tbody id="monitor-routes-modal-body">
                        <tr>
                            <td colspan="7" class="text-center" style="padding: 30px; color: var(--text-muted);">正在加载数据...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p style="margin-top: 15px; font-size: 0.8rem; color: var(--text-muted);">数据每 10 秒随监控面板同步刷新。此列表仅显示请求频率较高的接口路径。</p>
        </div>
    </div>
    <style>
        #rag-debug-btn:active { transform: scale(0.96); box-shadow: none; opacity: 0.8; }
        .btn-red-outline { background: transparent; border: 1px solid #ef4444 !important; color: #ef4444 !important; }
        .btn-red-outline:hover { background: #fef2f2; }
    </style>
