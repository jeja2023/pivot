# 可选：在另一台局域网服务器提供语音 API。默认内置 CPU 模式只运行主 Compose，无需此容器。
# 模型目录预先离线导入。
services:
  speech:
    image: pivot-speech:1
    build:
      context: .
      dockerfile: docker/speech-service/Dockerfile
    environment:
      SPEECH_API_KEY: ${PIVOT_VOICE_API_KEY:?请配置语音服务密钥}
      SPEECH_BACKEND: funasr
      SPEECH_DEVICE: cpu
      SPEECH_MODEL_DIR: /models/paraformer
      SPEECH_STREAM_MODEL_DIR: /models/paraformer-streaming
      SPEECH_PUNC_MODEL_DIR: /models/punctuation
    ports:
      - "${PIVOT_SPEECH_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      # 与主服务 ./data、./uploads、./logs 一样，相对于部署目录挂载。
      # artifacts/ 仅用于联网准备；生产模型放在 ./data/speech-models/。
      - ./data/speech-models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
    networks: [speech-private]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  speech-private:
    driver: bridge
