# 独立语音微服务 GPU 算力覆盖层：将 FunASR 推理从 CPU 调度至指定 GPU 显卡
#
# 使用方式：
#   docker compose -f docker-compose.speech.yml -f docker-compose.speech.gpu.yml up -d
#
# 环境变量说明：
#   SPEECH_GPU_ID：指定分配给语音服务的 GPU 物理卡号（默认卡 0，避免占用主对话模型的显卡）

services:
  speech:
    environment:
      SPEECH_DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPEECH_GPU_ID:-0}"]
              capabilities: [gpu]
