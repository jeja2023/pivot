# Pivot AI 智能中枢 - 生产环境部署配置

version: '3.8'

services:
  pivot:
    # 镜像名称：需要与打包时生成的镜像标签保持一致
    image: pivot
    container_name: pivot

    # 端口映射：宿主机端口 -> 容器端口
    ports:
      - "3000:3000"

    # 环境变量：运行时自动读取同目录下的 .env 文件
    env_file:
      - .env

    # GPU 透传：允许容器内执行 nvidia-smi，用于显存监控和保护逻辑
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PIVOT_UPDATER_URL: http://pivot-updater:3300

    # 数据持久化：保证数据库和上传文件在容器重建后仍然保留
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

    # 网络：加入外部共享网络 ai-bridge
    networks:
      - ai-bridge

    # 重启策略：容器异常退出后自动拉起
    restart: always

    # 日志管理：限制单文件大小和保留数量，避免占满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pivot-updater:
    profiles:
      - online-update
    build:
      context: ./updater
    container_name: pivot-updater
    env_file:
      - .env
    environment:
      PIVOT_UPDATER_PORT: 3300
      PIVOT_UPDATE_WORKDIR: ${PIVOT_HOST_PROJECT_DIR:-/workspace}/source
      PIVOT_UPDATE_BUILD_CONTEXT: ${PIVOT_HOST_PROJECT_DIR:-/workspace}/source
      PIVOT_UPDATE_COMPOSE_FILE: ${PIVOT_HOST_PROJECT_DIR:-/workspace}/docker-compose.yml
      PIVOT_UPDATE_IMAGE: pivot
      PIVOT_UPDATE_SERVICE: pivot
      PIVOT_UPDATE_STATE_FILE: ${PIVOT_HOST_PROJECT_DIR:-/workspace}/updater-state.json
      PIVOT_LOG_TIME_ZONE: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:${PIVOT_HOST_PROJECT_DIR:-/workspace}
    networks:
      - ai-bridge
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-bridge:
    external: true
