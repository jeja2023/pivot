# Pivot AI 智能中枢 - 生产环境部署配置

version: '3.8'

services:
  pivot:
    # 镜像名称：需要与打包时生成的镜像标签保持一致
    image: pivot
    container_name: pivot

    # 端口映射：宿主机端口 -> 容器端口
    ports:
      - "3000:3000"

    # 环境变量：运行时自动读取同目录下的 .env 文件
    env_file:
      - .env

    # GPU 透传：允许容器内执行 nvidia-smi，用于显存监控和保护逻辑
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    # 数据持久化：保证数据库和上传文件在容器重建后仍然保留
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

    # 网络：加入外部共享网络 ai-bridge
    networks:
      - ai-bridge

    # 重启策略：容器异常退出后自动拉起
    restart: always

    # 日志管理：限制单文件大小和保留数量，避免占满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-bridge:
    external: true
