<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智枢 Pivot 连接失败</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #172033;
        }
        main {
            width: min(560px, calc(100vw - 40px));
            border: 1px solid #d8e0ea;
            border-radius: 10px;
            padding: 28px;
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }
        h1 { margin: 0 0 10px; font-size: 22px; }
        p { margin: 8px 0; color: #526070; line-height: 1.6; }
        code { word-break: break-all; }
        button {
            margin-top: 18px;
            height: 36px;
            border: 0;
            border-radius: 8px;
            padding: 0 16px;
            background: #0f766e;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .meta { margin-top: 14px; font-size: 13px; color: #64748b; }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e5edf7; }
            main { background: #111827; border-color: #334155; box-shadow: none; }
            p, .meta { color: #aab7c7; }
        }
    </style>
</head>
<body>
    <main>
        <h1>智枢 Pivot 连接错误</h1>
        <p id="message">无法连接到智枢服务器，请检查您的网络连接或服务器运行状态。</p>
        <p class="meta" id="target"></p>
        <button id="retry">重新连接</button>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        const message = params.get('message');
        const target = params.get('target');
        const env = params.get('env');
        if (message) document.getElementById('message').textContent = message;
        document.getElementById('target').innerHTML = [
            env ? '当前环境：' + env : '',
            target ? '目标地址：<code>' + target.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])) + '</code>' : ''
        ].filter(Boolean).join('<br>');
        document.getElementById('retry').addEventListener('click', () => window.pivotDesktop.retry());
    </script>
</body>
</html>
