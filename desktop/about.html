<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>关于 Pivot</title>
    <style>
        :root {
            --text: #0f172a;
            --muted: #64748b;
            --soft: #f8fafc;
            --line: #e2e8f0;
            --brand: #059669;
            --brand-dark: #047857;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: #ffffff;
            font-family: "Microsoft YaHei UI", "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        .dialog {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #cbd5e1;
        }

        .titlebar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px 0 18px;
            border-bottom: 1px solid #edf2f7;
            background: #ffffff;
            -webkit-app-region: drag;
        }

        .titlebar strong {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 8px;
            color: #475569;
            background: transparent;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }

        .close-btn:hover {
            color: #ffffff;
            background: #ef4444;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 26px 18px;
        }

        .hero {
            display: grid;
            grid-template-columns: 56px 1fr;
            gap: 16px;
            align-items: center;
        }

        .logo-mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #ffffff;
            background: var(--brand);
            box-shadow: 0 14px 30px rgba(5, 150, 105, 0.24);
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 0;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.18;
            font-weight: 900;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 16px;
        }

        .meta-card {
            min-width: 0;
            min-height: 56px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--soft);
        }

        .meta-card.wide {
            grid-column: 1 / -1;
        }

        .meta-label {
            display: block;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .meta-value {
            display: block;
            margin-top: 7px;
            color: var(--text);
            font-size: 14px;
            line-height: 1.25;
            font-weight: 850;
            overflow-wrap: anywhere;
        }

        .summary {
            margin: 12px 0 0;
            padding: 10px 14px;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            color: #14532d;
            background: #f0fdf4;
            font-size: 12px;
            line-height: 1.58;
        }

        .close-btn:focus-visible {
            outline: 2px solid rgba(5, 150, 105, 0.42);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="dialog">
        <header class="titlebar">
            <strong>关于 Pivot</strong>
            <button class="close-btn" type="button" data-close aria-label="关闭">&times;</button>
        </header>
        <main class="content">
            <section class="hero" aria-label="Pivot 智枢">
                <div class="logo-mark" aria-hidden="true">P</div>
                <div>
                    <h1>Pivot 智枢</h1>
                    <p class="subtitle">AI 智能枢纽桌面客户端</p>
                </div>
            </section>
            <section class="meta-grid" aria-label="客户端信息">
                <div class="meta-card">
                    <span class="meta-label">当前版本</span>
                    <strong class="meta-value" id="version">-</strong>
                </div>
                <div class="meta-card">
                    <span class="meta-label">运行模式</span>
                    <strong class="meta-value" id="mode">-</strong>
                </div>
            </section>
            <p class="summary">面向私有化、离线化和内网场景的统一 AI 工作入口，支持对话、知识库、工具库和自动化任务。</p>

        </main>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        function setText(id, value) {
            const element = document.getElementById(id);
            if (!element) return;
            element.textContent = value || "-";
            element.title = value || "-";
        }
        setText("version", "v" + (params.get("version") || "-"));
        setText("mode", params.get("mode") || "-");
        function closeWindow() {
            if (window.pivotAbout && typeof window.pivotAbout.close === "function") window.pivotAbout.close();
            else window.close();
        }
        document.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", closeWindow));
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeWindow();
        });
    </script>
</body>

</html>
