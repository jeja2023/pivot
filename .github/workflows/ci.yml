name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Text integrity check
        run: npm run check:text

      - name: Syntax check
        run: node scripts/check_syntax.js

      - name: Chat asset check
        run: node scripts/check_chat_assets.js

      - name: Lint
        run: npm run lint

      - name: Security tests
        run: node tests/security.test.js
