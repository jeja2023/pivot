name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    env:
      TZ: Asia/Shanghai
      PG_TIMEZONE: Asia/Shanghai

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pivot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 增量规范检查使用 PR 目标分支与 HEAD 的 merge-base，需要完整历史。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit policy
        run: npm run audit:policy

      # 覆盖文本完整性、开发规范、语法、聊天资源、安全 HTML、window 全局与 E2E 脚手架检查
      - name: Project checks
        run: npm run check

      - name: Changed-file development standards
        run: npm run check:standards:changed

      - name: Lint
        run: npm run lint

      # 浏览器运行时必须在单元测试之前准备好；否则 agent-browser 测试会被错误跳过
      # 而 CI 仍显示绿色。
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      # 顺序运行全部测试套件，与本地 npm test 口径保持一致
      - name: All test suites
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:all

      # 发布门禁必须在 CI 中拥有独立的强制步骤：覆盖分层评测硬门、双裁判
      # 分歧/人工复核、灰度熔断回滚与数据库级发布集成，避免它们被全量测试
      # 输出淹没而在发布前未被单独审阅。
      - name: Agent release quality gates
        if: matrix.node-version == '22'
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:agent:release-gates

      # 独立展示进程崩溃、非幂等恢复和资源争用门禁，避免被全量测试输出淹没。
      - name: Agent runtime fault and resource gates
        if: matrix.node-version == '22'
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:agent:quality

      # 原生 V8 覆盖率阈值防止测试退化为只读取源码文本而不执行关键分支。
      - name: Node test coverage threshold
        if: matrix.node-version == '22'
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:coverage

      - name: Browser end-to-end tests
        if: matrix.node-version == '22'
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:e2e

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache speech wheelhouse
        id: cache-speech-wheelhouse
        uses: actions/cache@v4
        with:
          path: artifacts/speech-wheelhouse
          key: speech-wheelhouse-${{ runner.os }}-${{ hashFiles('docker/speech-service/requirements*.txt') }}

      - name: Prepare speech wheelhouse for container build
        if: steps.cache-speech-wheelhouse.outputs.cache-hit != 'true'
        run: python3 docker/speech-service/prepare_assets.py --dependencies-only

      - name: Build production Docker image
        run: docker build --pull -t pivot:ci .

      - name: Inspect non-root image contract
        run: docker image inspect pivot:ci --format '{{.Config.User}}' | grep -x node

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned unpacked desktop smoke artifact
        env:
          PIVOT_DISTRIBUTION_STEALTH_SECRET: pivot-ci-unpacked-smoke-secret
        run: npm run pack:win

      - name: Verify unpacked desktop layout
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist-electron-remote/win-unpacked/Pivot.exe')) { throw '缺少 Pivot.exe' }
          if (-not (Test-Path 'dist-electron-remote/win-unpacked/resources/config.json')) { throw '缺少桌面配置' }
