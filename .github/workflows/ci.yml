name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      PG_TIMEZONE: Asia/Shanghai

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pivot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit policy
        run: npm run audit:policy

      # 覆盖文本完整性、开发规范、语法、聊天资源、安全 HTML、window 全局与 E2E 脚手架检查
      - name: Project checks
        run: npm run check

      - name: Changed-file development standards
        run: npm run check:standards:changed

      - name: Lint
        run: npm run lint

      # 浏览器运行时必须在单元测试之前准备好；否则 agent-browser 测试会被错误跳过
      # 而 CI 仍显示绿色。
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      # 顺序运行全部测试套件，与本地 npm test 口径保持一致
      - name: All test suites
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:all

      # 原生 V8 覆盖率阈值防止测试退化为只读取源码文本而不执行关键分支。
      - name: Node test coverage threshold
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:coverage

      - name: Browser end-to-end tests
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:e2e
