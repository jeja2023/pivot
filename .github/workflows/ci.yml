name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PG_TIMEZONE: Asia/Shanghai

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pivot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit policy
        run: npm run audit:policy

      # 覆盖文本完整性、开发规范、语法、聊天资源、安全 HTML、window 全局与 E2E 脚手架检查
      - name: Project checks
        run: npm run check

      - name: Lint
        run: npm run lint

      # 顺序运行全部测试套件，与本地 npm test 口径保持一致
      - name: All test suites
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
          DATABASE_URL: postgres://postgres:password@localhost:5432/pivot_test
        run: npm run test:all
