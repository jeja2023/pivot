name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit policy
        run: npm run audit:policy

      # 覆盖文本完整性、开发规范、语法、聊天资源、安全 HTML、window 全局与 E2E 脚手架检查
      - name: Project checks
        run: npm run check

      - name: Lint
        run: npm run lint

      # 顺序运行全部测试套件，与本地 npm test 口径保持一致
      - name: All test suites
        run: npm run test:all
